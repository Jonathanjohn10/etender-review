<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Tendering Prototype</title>
<style>
:root{
  --wr-topbar:#13585A; --wr-panel:#1A797B; --wr-panel-head:#197375; --wr-panel-hover:#318788; --wr-panel-line:rgba(255,255,255,.14); --wr-panel-muted:rgba(255,255,255,.66); --wr-badge:#E32114;
  --color-primary:#13585A; --color-primary-hover:#0E4446; --color-primary-soft:#E3F0F0; --color-primary-disabled:#A9C4C5;
  --color-bg-app:#F4F6F6; --color-bg-surface:#FFFFFF; --color-bg-muted:#F7F7F7; --color-bg-strong:#EEF1F1; --color-bg-backdrop:rgba(10,30,30,.48);
  --color-border:#DDDDDD; --color-border-soft:#EBEBEB; --color-border-strong:#BFBFBF;
  --color-text:#222222; --color-text-body:#3F3F3F; --color-text-muted:#666666; --color-text-disabled:#8C8C8C; --color-on-dark:#FFFFFF;
  --color-error:#C13515; --color-link:#0645AD; --color-focus:#13585A;
  --color-proto:#460479; --color-proto-bg:#F5EFF9; --color-proto-line:#D9C6E6;
  --status-green-bg:#E6F4EA; --status-green-fg:#1E6B34; --status-amber-bg:#FFF4E0; --status-amber-fg:#8A5A00;
  --status-orange-bg:#FDEBD8; --status-orange-fg:#9A4A00; --status-red-bg:#FDECEA; --status-red-fg:#C13515;
  --status-yellow-bg:#FFF9C4; --status-yellow-fg:#6B5E00; --status-grey-bg:#EFEFEF; --status-grey-fg:#5E5E5E;
  --status-blue-bg:#E8EEF9; --status-blue-fg:#1F4E9E;
  --highlight-low:#DFF3E3; --highlight-high:#FADCD9; --diff-mod:#FFF9C4; --diff-add:#DFF3E3; --diff-del:#FADCD9;
  --font:'Open Sans','Airbnb Cereal VF',Circular,Inter,-apple-system,system-ui,'Segoe UI',Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-cap:13px; --fs-base:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:24px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --r-sm:8px; --r-md:14px; --r-full:9999px; --bw:1px;
  --shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.05) 0 2px 6px,rgba(0,0,0,.1) 0 6px 16px;
  --topbar-h:56px; --proto-h:48px; --edge-w:10px; --panel-w:280px; --control-h:38px; --control-h-sm:32px; --page-max:1440px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:400 var(--fs-base)/1.45 var(--font);color:var(--color-text);background:var(--color-bg-app);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--color-primary);width:16px;height:16px;margin:0;vertical-align:middle;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--sp-3)}
.sp{flex:1}
.muted{color:var(--color-text-muted)} .b{font-weight:600} .sm{font-size:var(--fs-cap)} .xs{font-size:var(--fs-sm)} .mono{font-family:var(--mono)}
.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
.na{color:var(--color-error);font-weight:700}
.req{color:var(--color-error)}
.link{background:none;border:0;padding:0;color:var(--color-link);text-decoration:underline;cursor:pointer;font:inherit}
.ok{color:var(--status-green-fg);font-weight:700} .warn{color:var(--status-amber-fg);font-weight:700} .bad{color:var(--color-error);font-weight:700}

/* ---------- prototype bar ---------- */
.proto{position:sticky;top:0;z-index:60;min-height:var(--proto-h);display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-2) var(--sp-4);background:var(--color-proto-bg);border-bottom:var(--bw) dashed var(--color-proto-line);color:var(--color-proto);font-size:var(--fs-cap)}
.proto .tag{font-size:10px;letter-spacing:.32px;text-transform:uppercase;background:var(--color-proto);color:var(--color-on-dark);padding:2px 8px;border-radius:var(--r-full);font-weight:700}
.proto select{max-width:240px;height:30px;border:var(--bw) solid var(--color-proto-line);border-radius:var(--r-full);padding:0 var(--sp-3);background:var(--color-bg-surface);font-size:var(--fs-cap);color:var(--color-text)}
.proto .pbtn{height:30px;padding:0 var(--sp-3);border:var(--bw) solid var(--color-proto-line);border-radius:var(--r-full);background:var(--color-bg-surface);color:var(--color-proto);font-size:var(--fs-cap);font-weight:600;cursor:pointer;white-space:nowrap}
.proto .pbtn:hover{border-color:var(--color-proto)}
.proto .pbtn[aria-disabled=true]{color:var(--color-text-disabled);cursor:not-allowed;border-color:var(--color-border-soft)}
.proto .clock{display:inline-flex;gap:var(--sp-2);align-items:center;padding:0 var(--sp-3);height:30px;border-radius:var(--r-full);background:var(--color-bg-surface);border:var(--bw) solid var(--color-proto-line);color:var(--color-text)}
.proto .grp{display:flex;gap:var(--sp-1);align-items:center}

/* ---------- Wrench shell ---------- */
.top{position:relative;z-index:50;height:var(--topbar-h);display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-4) 0 var(--sp-2);background:var(--wr-topbar);color:var(--color-on-dark)}
.logo{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1;color:var(--color-on-dark)}
.ptitle{font-size:var(--fs-md);margin-left:var(--sp-5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-x{width:32px;height:32px;border:0;border-radius:var(--r-sm);background:var(--color-bg-surface);color:var(--wr-topbar);font:700 var(--fs-cap)/1 var(--mono);cursor:pointer;flex:none}
.tico{position:relative;width:40px;height:40px;border:0;border-radius:var(--r-full);background:transparent;color:var(--color-on-dark);font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none}
.tico:hover{background:rgba(255,255,255,.12)}
.top :focus-visible,.opanel :focus-visible{outline-color:var(--color-on-dark)}
.tico--search{background:var(--color-bg-surface);color:var(--wr-topbar);width:44px;height:36px;font-weight:700}
.tico b{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:var(--wr-badge);color:var(--color-on-dark);font-size:var(--fs-xs);display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:var(--r-full);display:grid;place-items:center;font-size:var(--fs-sm);font-weight:700;box-shadow:inset 0 0 0 2px var(--color-on-dark)}
.who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-size:var(--fs-cap);margin-right:var(--sp-1)} .who small{opacity:.8;font-size:var(--fs-xs)}
.edge{position:fixed;left:0;top:0;bottom:0;width:var(--edge-w);background:var(--wr-topbar);z-index:40}
.opanel{position:fixed;left:0;top:0;bottom:0;width:var(--panel-w);z-index:90;display:flex;flex-direction:column;background:var(--wr-panel);color:var(--color-on-dark);box-shadow:4px 0 24px rgba(0,0,0,.25)}
.op-head{height:var(--topbar-h);flex:none;display:flex;align-items:center;gap:var(--sp-5);padding:0 var(--sp-4) 0 var(--sp-2);background:var(--wr-topbar)}
.op-list{list-style:none;margin:0;padding:0}
.op-item{width:100%;display:flex;align-items:center;gap:var(--sp-3);height:46px;padding:0 var(--sp-4) 0 var(--sp-5);border:0;background:transparent;color:var(--color-on-dark);font-size:15px;text-align:left;cursor:pointer}
.op-item i{width:22px;font-style:normal;text-align:center}
.op-item:hover{background:var(--wr-panel-hover)}
.op-item[aria-current=page]{background:var(--wr-panel-hover);box-shadow:inset 3px 0 0 var(--color-on-dark);font-weight:600}
.op-cat{margin:var(--sp-3) var(--sp-4) var(--sp-1);padding-top:var(--sp-2);border-top:var(--bw) solid var(--wr-panel-line);font-size:var(--fs-sm);font-weight:700;color:var(--wr-panel-muted)}
.op-back{display:flex;align-items:center;gap:var(--sp-3);height:50px;margin:var(--sp-2);padding:0 var(--sp-4);border:0;background:var(--wr-panel-head);color:var(--color-on-dark);font-size:var(--fs-md);cursor:pointer;text-align:left}
.main{margin-left:var(--edge-w);min-height:calc(100vh - var(--topbar-h) - var(--proto-h))}
.page{max-width:var(--page-max);margin:0 auto;padding:var(--sp-5) var(--sp-6) 120px}

/* ---------- page header & action layout ---------- */
.crumb{font-size:var(--fs-cap);color:var(--color-text-muted);margin-bottom:var(--sp-1)}
.crumb .link{color:var(--color-text-muted)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-5);margin-bottom:var(--sp-4);flex-wrap:wrap}
.ph h1{font-size:var(--fs-xl);font-weight:600;letter-spacing:-.3px}
.ph .meta{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-top:var(--sp-2);color:var(--color-text-muted);font-size:var(--fs-cap)}
.actions{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;justify-content:flex-end}
.gate{display:flex;gap:var(--sp-2);align-items:center;justify-content:flex-end;font-size:var(--fs-cap);color:var(--status-amber-fg);margin-top:var(--sp-2);text-align:right}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:var(--control-h);padding:0 var(--sp-4);border:var(--bw) solid var(--color-border-strong);border-radius:var(--r-sm);background:var(--color-bg-surface);color:var(--color-text);font-size:var(--fs-base);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-p{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-dark)}
.btn-p:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover);color:var(--color-on-dark)}
.btn-g{border-color:transparent;background:transparent;color:var(--color-text)}
.btn-g:hover{background:var(--color-bg-strong);border-color:transparent}
.btn-d{border-color:var(--color-error);color:var(--color-error)}
.btn-d:hover{background:var(--status-red-bg);color:var(--color-error);border-color:var(--color-error)}
.btn-df{background:var(--color-error);border-color:var(--color-error);color:var(--color-on-dark)}
.btn-df:hover{background:#A52B10;color:var(--color-on-dark)}
.btn-sm{height:var(--control-h-sm);padding:0 var(--sp-3);font-size:var(--fs-cap)}
.btn[aria-disabled=true]{cursor:not-allowed;color:var(--color-text-disabled);background:var(--color-bg-muted);border-color:var(--color-border-soft)}
.btn-p[aria-disabled=true]{background:var(--color-primary-disabled);border-color:var(--color-primary-disabled);color:var(--color-on-dark)}
.btn-g[aria-disabled=true]{background:transparent;border-color:transparent}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;right:0;top:calc(100% + 6px);z-index:120;width:max-content;max-width:300px;white-space:normal;text-align:left;background:var(--color-text);color:var(--color-on-dark);font:500 var(--fs-sm)/1.35 var(--font);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);box-shadow:var(--shadow);pointer-events:none}
[data-tip].tip-l:hover::after,[data-tip].tip-l:focus-visible::after{right:auto;left:0}
.mwrap{position:relative;display:inline-flex}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:70;min-width:260px;max-width:340px;max-height:65vh;overflow:auto;margin:0;padding:var(--sp-2) 0;list-style:none;background:var(--color-bg-surface);border-radius:var(--r-md);box-shadow:var(--shadow);border:var(--bw) solid var(--color-border-soft)}
.menu.menu-l{left:0;right:auto}
.menu h5{margin:var(--sp-2) var(--sp-4) var(--sp-1);font-size:var(--fs-xs);font-weight:700;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.04em}
.menu .mi{display:flex;flex-direction:column;width:100%;padding:var(--sp-2) var(--sp-4);border:0;background:transparent;text-align:left;cursor:pointer;font-size:var(--fs-base)}
.menu .mi:hover{background:var(--color-bg-strong)}
.menu .mi small{font-size:var(--fs-sm);color:var(--color-text-muted);font-weight:400}
.menu .mi[aria-disabled=true]{color:var(--color-text-disabled);cursor:not-allowed}
.menu .mi.danger{color:var(--color-error)}
.menu .mi.danger[aria-disabled=true]{color:var(--color-text-disabled)}
.menu hr{border:0;border-top:var(--bw) solid var(--color-border-soft);margin:var(--sp-2) 0}

/* ---------- lifecycle ---------- */
.life{display:flex;list-style:none;margin:0 0 var(--sp-4);padding:var(--sp-4) var(--sp-5);background:var(--color-bg-surface);border:var(--bw) solid var(--color-border);border-radius:var(--r-md);overflow-x:auto;gap:0}
.life li{flex:1;min-width:120px;display:flex;flex-direction:column;gap:var(--sp-1);position:relative;padding-right:var(--sp-3)}
.life li::before{content:"";position:absolute;left:14px;right:0;top:13px;height:2px;background:var(--color-border)}
.life li:last-child::before{display:none}
.life .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:var(--r-full);display:grid;place-items:center;font-size:var(--fs-sm);font-weight:700;background:var(--color-bg-surface);border:2px solid var(--color-border-strong);color:var(--color-text-muted)}
.life .lbl{font-size:var(--fs-cap);font-weight:600;color:var(--color-text-muted)}
.life .when{font-size:var(--fs-sm);color:var(--color-text-muted)}
.life .done::before{background:var(--color-primary)}
.life .done .dot{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-dark)}
.life .done .lbl{color:var(--color-text)}
.life .cur .dot{border-color:var(--color-primary);color:var(--color-primary);box-shadow:0 0 0 4px var(--color-primary-soft)}
.life .cur .lbl{color:var(--color-primary)}
.life.dead{opacity:.55}

/* ---------- cards, tabs, kpis ---------- */
.card{background:var(--color-bg-surface);border:var(--bw) solid var(--color-border);border-radius:var(--r-md);padding:var(--sp-5)}
.card.p0{padding:0;overflow:hidden}
.card h3{font-size:var(--fs-md);font-weight:600}
.card-h{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.card-h h3{margin-right:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-4)}
.stack{display:flex;flex-direction:column;gap:var(--sp-4)}
.tabs{display:flex;gap:var(--sp-5);border-bottom:var(--bw) solid var(--color-border);margin:var(--sp-2) 0 var(--sp-4);overflow-x:auto}
.tab{border:0;background:none;padding:var(--sp-3) 0;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:var(--fs-base);font-weight:600;color:var(--color-text-muted);cursor:pointer;white-space:nowrap;position:relative}
.tab[aria-selected=true]{color:var(--color-primary);border-color:var(--color-primary)}
.tab[aria-disabled=true]{color:var(--color-text-disabled);cursor:not-allowed}
.tab .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:var(--r-full);background:var(--color-bg-strong);font-size:var(--fs-xs);color:var(--color-text-body)}
.seg{display:inline-flex;gap:var(--sp-1);padding:3px;border-radius:var(--r-full);background:var(--color-bg-strong);flex-wrap:wrap}
.seg button{height:30px;padding:0 var(--sp-3);border:0;border-radius:var(--r-full);background:transparent;font-size:var(--fs-cap);font-weight:600;color:var(--color-text-body);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--color-bg-surface);color:var(--color-primary);box-shadow:var(--shadow)}
.seg .cnt{margin-left:4px;color:var(--color-text-muted);font-weight:500}
.kpis{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.kpi{flex:1;min-width:180px;background:var(--color-bg-surface);border:var(--bw) solid var(--color-border);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4)}
.kpi small{display:block;font-size:var(--fs-sm);color:var(--color-text-muted);font-weight:600}
.kpi b{display:block;font-size:var(--fs-md);font-weight:600;margin-top:2px}
.kpi.low{background:var(--highlight-low);border-color:transparent} .kpi.high{background:var(--highlight-high);border-color:transparent}
.dl{display:grid;grid-template-columns:minmax(140px,max-content) 1fr;gap:var(--sp-2) var(--sp-4);font-size:var(--fs-cap)}
.dl dt{color:var(--color-text-muted)} .dl dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-1)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 var(--sp-2);border-radius:var(--r-full);background:var(--color-bg-strong);font-size:var(--fs-sm)}
.chip.on{background:var(--color-primary-soft);color:var(--color-primary);font-weight:600}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 var(--sp-3);border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:700;white-space:nowrap;background:var(--status-grey-bg);color:var(--status-grey-fg)}
.p-green{background:var(--status-green-bg);color:var(--status-green-fg)} .p-blue{background:var(--status-blue-bg);color:var(--status-blue-fg)}
.p-amber{background:var(--status-amber-bg);color:var(--status-amber-fg)} .p-orange{background:var(--status-orange-bg);color:var(--status-orange-fg)}
.p-red{background:var(--status-red-bg);color:var(--status-red-fg)} .p-yellow{background:var(--status-yellow-bg);color:var(--status-yellow-fg)}
.p-outline{background:var(--color-bg-surface);color:var(--status-blue-fg);box-shadow:inset 0 0 0 1px currentColor}
.p-teal{background:var(--color-primary-soft);color:var(--color-primary)}

/* ---------- tables ---------- */
.tw{overflow:auto;border:var(--bw) solid var(--color-border);border-radius:var(--r-md);background:var(--color-bg-surface)}
.card .tw{border-radius:var(--r-sm)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-cap)}
.tbl th{position:sticky;top:0;z-index:2;background:#FAFAFA;text-align:left;font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;color:var(--color-text);padding:var(--sp-3);border-bottom:var(--bw) solid var(--color-border);white-space:nowrap}
.tbl td{padding:var(--sp-2) var(--sp-3);border-bottom:var(--bw) solid var(--color-border-soft);vertical-align:middle;height:46px}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--color-bg-muted)}
.tbl tr.sel td{background:var(--color-primary-soft)}
.tbl tr.dim td{color:var(--color-text-disabled)}
.tbl tr.grp td{background:var(--color-bg-muted);font-weight:700;height:34px}
.tbl tfoot td{font-weight:700;background:var(--color-bg-muted);border-top:var(--bw) solid var(--color-border)}
.tbl .chk{width:44px}
.tbl .in{height:32px}
.tbl .lo{background:var(--highlight-low)!important} .tbl .hi{background:var(--highlight-high)!important}
.tbl tr.d-mod td{background:var(--diff-mod)} .tbl tr.d-add td{background:var(--diff-add)} .tbl tr.d-del td{background:var(--diff-del)}
.tbl .vh{text-align:center;border-left:var(--bw) solid var(--color-border-soft)}
.stk{position:sticky;left:0;z-index:1;background:var(--color-bg-surface)}
th.stk{z-index:3;background:#FAFAFA}
.cell-sub{display:block;font-size:var(--fs-sm);color:var(--color-text-muted)}

/* ---------- forms ---------- */
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4) var(--sp-5)}
.fg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f>.lb{font-size:var(--fs-cap);font-weight:600;color:var(--color-text-body)}
.in{height:var(--control-h);width:100%;padding:0 var(--sp-3);border:var(--bw) solid var(--color-border-strong);border-radius:var(--r-sm);background:var(--color-bg-surface);font-size:var(--fs-base)}
.in:focus{outline:0;border-color:var(--color-primary);box-shadow:inset 0 0 0 1px var(--color-primary)}
textarea.in{height:auto;min-height:84px;padding:var(--sp-2) var(--sp-3);resize:vertical}
.in:disabled,.in[readonly]{background:var(--color-bg-muted);border-color:var(--color-border-soft);color:var(--color-text-body)}
.in.err{border-color:var(--color-error);box-shadow:inset 0 0 0 1px var(--color-error)}

<script>
'use strict';
/* =====================================================================
   E-Tendering prototype — WRENCH SmartProject (Procurement Control)
   Single-file vanilla JS. State lives in `db` and persists to localStorage.
   ===================================================================== */

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const p2 = n => String(n).padStart(2, '0');
const toD = s => { const [d, t = '00:00'] = s.split('T'); const [y, m, dd] = d.split('-').map(Number); const [hh, mm] = t.split(':').map(Number); return new Date(y, m - 1, dd, hh, mm); };
const iso = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
const fdt = s => { if (!s) return '—'; const d = toD(s); return `${p2(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };

  },
  open(t, s) {

    if (t.status === 'Obsolete') return 'Tender is obsolete';
    if (db.now < t.open) return 'Bid open date is not yet reached. Cannot start the evaluation now';
    if (opened(t, s)) return '';
    if (t.type === 'TC' && t.settings.openMode === 'two' && t.settings.sequence !== 'none') {
      const first = t.settings.sequence; const other = first === 'T' ? 'C' : 'T';
      if (s === other && !opened(t, first)) return `${STAGE[s]} bid can be opened only after the ${STAGE[first].toLowerCase()} bid is opened (Two-Stage, ${STAGE[first]} First)`;
    }
    if (officers(t, s).length && !isOfficer(t, s)) return 'Bid is not open it. Proceed once the Bid is opened by designated team';
    if (!officers(t, s).length && !inTeam(t) && !can('compare')) return 'Only tender team members can open this bid';

  },
  evaluate(t, s) {

function vGate(t, r) {
  // returns { edit:'' | reason, scope:'all'|'T'|'C', submit:'' | reason }
  const res = { edit: '', scope: 'all', submit: '' };
  const lock = m => { res.edit = res.edit || m; res.submit = res.submit || m; };
  if (t.status === 'Obsolete') lock('Tender is obsolete. No further operations are allowed');
  else if (['Rejected'].includes(r.status)) lock('You rejected this tender invitation');
  else if (['LOI Issued', 'Bid Rejected'].includes(r.status)) lock('Bid evaluation is complete for this tender');
  else if (!isPublishedTo(r)) lock('Available after the buyer publishes the tender to you');
  else if (t.status === 'Revised' || r.pubRev !== t.rev) lock('The buyer is revising this tender. You can edit your bid again after it is republished');
  else if (r.status === 'Resubmission') {
    const due = r.resub && r.resub.due;

    else res.scope = r.resub.scope === 'B' ? 'all' : r.resub.scope;

const permDenied = r => /^You need|^Only the Tender Manager|^You are not/.test(r || '');
function primaryKey(t) {
  const d = actionDefs(t), s = t.status;
  let c = [];
  if (s === 'Draft') c = ['edit'];
  else if (s === 'Created') c = t.settings.inviteFirst ? ['invite', 'publish'] : ['publish', 'invite'];
  else if (s === 'Invites Sent' || s === 'Revised') c = ['publish', 'edit'];
  else if (['Published', 'Republished'].includes(s)) c = ['remind', 'compare'];
  else if (s === 'Closed') c = ['open', 'remind'];
  else if (s === 'Bid Evaluation') c = !allOpened(t) ? (pendingEval(t) ? ['evaluate', 'open', 'compare'] : ['open', 'compare']) : pendingEval(t) ? ['evaluate', 'recommend', 'compare'] : ['recommend', 'compare'];
  else if (['Recommended', 'Part PO Issued'].includes(s)) c = ['po', 'notifySel', 'compare'];
  else if (s === 'PO Issued') c = ['pos'];
  return c.find(k => !permDenied(d[k].reason)) || null;
}
function secondaryKeys(t, pk) {
  const s = t.status; let c = [];
  if (['Created', 'Invites Sent', 'Revised'].includes(s)) c = ['invite', 'edit', 'publish'];
  else if (['Published', 'Republished'].includes(s)) c = ['edit'];
  else if (s === 'Closed') c = ['remind'];
  else if (s === 'Bid Evaluation') c = ['compare', 'open', 'evaluate'];
  else if (['Recommended', 'Part PO Issued'].includes(s)) c = ['recommend', 'compare'];
  else if (s === 'PO Issued') c = ['compare'];
  const d = actionDefs(t);
  return c.filter(k => k !== pk && !permDenied(d[k].reason) && !(k === 'open' && allOpened(t)) && !(k === 'evaluate' && !pendingEval(t))).slice(0, 2);
}
function actionBtn(d, key, cls) {

}
function moreMenu(t, exclude, id) {
  const d = actionDefs(t);
  const groups = [['Tender', ['edit', 'invite', 'publish', 'remind', 'revise', 'resub']], ['Evaluation & award', ['compare', 'recommend', 'notifySel', 'notifyRej', 'po', 'pos']], ['Records', ['activity', 'export']], ['', ['obsolete', 'remove']]];
  const open = db.ui.menu === id;
  const items = groups.map(([g, keys]) => {

function lifecycle(t) {
  const steps = ['Setup', 'Invitations', 'Published', 'Submission closed', 'Bids opened', 'Evaluated', 'Recommended', 'PO issued'];
  const s = t.status;

  if (s === 'Bid Evaluation') idx = !allOpened(t) ? 4 : pendingEval(t) ? 5 : 6;
  if (s === 'Obsolete') idx = -1;
  const when = [s === 'Revised' ? `Revising · Rev ${t.rev}` : '', t.settings.inviteFirst ? 'Required' : 'Optional', t.pubEver ? `Rev ${t.rev}` : '', fdt(t.sub), fdt(t.open), '', t.reco.vendors.length ? `${t.reco.vendors.length} vendor(s)` : '', t.pos.length ? `${t.pos.length} PO` : ''];
  return `<ol class="life${idx < 0 ? ' dead' : ''}" aria-label="Tender lifecycle">${steps.map((l, i) => `<li class="${i < idx ? 'done' : i === idx ? 'cur' : ''}"${i === idx ? ' aria-current="step"' : ''}><span class="dot">${i < idx ? '✓' : i + 1}</span><span class="lbl">${l}</span><span class="when">${esc(when[i])}</span></li>`).join('')}</ol>`;
}

/* ---------------- evaluation tab: opening + technical/commercial evaluation ---------------- */

    } else {

        ${gate && (dateGate || gate.includes('only after')) ? `<div class="bn bn-lock"><div>${esc(gate)}${db.now < t.open ? ` · opens in ${until(db.now, t.open)}` : ''}</div></div>` : ''}

    ${rows.map(r => {
      const v = V(r.code), b = t.bids[r.code].cur, e = t.evals[s][r.code];
      const techRej = s === 'C' && t.type === 'TC' && t.evals.T[r.code] && t.evals.T[r.code].status === 'Rejected';
      const rowGate = eg || (techRej ? 'Vendor was rejected in technical evaluation' : '') || (r.status === 'Resubmission' ? 'Vendor is resubmitting. Evaluate after the new submission' : '');
      const docs = b.docs.filter(d => d.rev === t.rev && d.purpose === 'Bid Submission');
      return `<tr class="${techRej ? 'dim' : ''}"><td><b>${esc(v.name)}</b>${techRej ? '<span class="cell-sub">Technically rejected</span>' : ''}${r.status === 'Resubmission' ? `<span class="cell-sub">${pill('Resubmission')}</span>` : ''}</td>
        <td>${fdt(b.submittedAt)}<span class="cell-sub">Rev ${b.rev}${b.count > 1 ? ` · ${b.count} submissions` : ''}</span></td>

        <td style="max-width:240px;white-space:normal">${e && e.remarks ? esc(e.remarks) : '<span class="muted">—</span>'}</td>

          <button class="btn btn-sm${e && e.status === 'Rejected' ? ' btn-d' : ''}" data-a="m-reject" data-s="${s}" data-code="${r.code}"${dis(rowGate)} aria-pressed="${!!(e && e.status === 'Rejected')}">✕ Reject</button>
          <button class="btn btn-g btn-sm" data-a="m-resub" data-code="${r.code}" data-s="${s}"${dis(G.resubmit(t))} title="Request resubmission">↻</button>

}
function officerRow(t, s, m, gate, dateGate) {

function vendorCompare(t, rows) {

  const tot = r => { const x = totals.find(y => y.code === r.code); const cls = allRQ && L1 && x.total === L1.total ? 'lo' : allRQ && H1 && x.total === H1.total && H1.code !== L1.code ? 'hi' : ''; return `<td class="vh"></td><td class="num ${cls}">${money(x.total)}</td>`; };
  return `<div class="kpis">${kpis}</div>

          <div class="pills">${subm ? `${stages(t).map(s => `<span>${STAGE[s].slice(0, 4)}</span>${opened(t, s) ? evalPill(evalStatus(t, s, r.code)) : pill('Not Opened')}`).join('')}<span>Pricing</span>${pill(pricingStatus(t, r.code))}<span>Terms</span>${t.tcs.some(c => (t.bids[r.code].cur.tc[c.code] || {}).r === 'R') ? pill('Deviations', 'p-amber') : pill('Accepted', 'p-green')}` : `<span>Status</span>${pill('Not Submitted')}`}</div>
          ${t.reco.vendors.includes(r.code) ? `<div style="margin:var(--sp-2) 0 0 var(--sp-5)">${pill('Recommended')}</div>` : ''}</li>`;

    <div>

      <div class="tw" style="max-height:520px"><table class="tbl" style="min-width:${360 + inc.length * 220}px"><thead>
        <tr><th class="stk" rowspan="2">Item</th><th rowspan="2" class="num">Qty</th>${inc.map(r => `<th class="vh" colspan="2">${esc(V(r.code).name)}</th>`).join('')}</tr>

function revCompare(t) {

function vNeedsAction(t, r) {
  if (!r || t.status === 'Obsolete') return false;
  if (r.status === 'Invited' && !r.acceptedAt) return db.now < t.sub;
  if (r.status === 'NDA Requested') return true;
  const g = vGate(t, r);
  if (g.edit) return false;
  if (t.settings.acceptMandatory && !r.acceptedAt) return true;
  const b = t.bids[r.code];
  return r.status === 'Resubmission' || !(b && b.cur.submittedAt && b.cur.rev === t.rev);
}
function vRowAction(t, r) {
  if (t.status === 'Obsolete' || ['Rejected', 'LOI Issued', 'Bid Rejected'].includes(r.status)) return ['View', ''];
  if (r.status === 'Invited' && !r.acceptedAt) return ['Respond to invitation', 'btn-p'];
  if (r.status === 'NDA Requested') return ['Upload NDA', 'btn-p'];
  if (['Invitation Accepted', 'NDA Submitted'].includes(r.status)) return ['View', ''];
  const g = vGate(t, r), b = t.bids[r.code];
  if (g.edit) return ['View bid', ''];
  if (r.status === 'Resubmission') return ['Resubmit bid', 'btn-p'];
  if (b && b.cur.submittedAt && b.cur.rev === t.rev) return ['Update bid', ''];

}

  confirm: c => ({ title: c.title || 'Confirm', size: 's', body: `<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="warn" style="font-size:22px" aria-hidden="true">⚠</span><div class="col" style="gap:var(--sp-2)"><p>${esc(c.text)}</p>${c.detail ? `<p class="help">${esc(c.detail)}</p>` : ''}</div></div>`, foot: `${cancelBtn(c.no || 'No')}<button class="btn ${c.danger ? 'btn-df' : 'btn-p'}" data-a="confirmYes">${esc(c.yes || 'Yes')}</button>` }),

  scenarios: () => ({
    title: 'Scenarios & test cases', drawer: true,
    body: `<p class="sm">Each scenario resets the data, signs in the right person and opens the right screen. Follow the steps, switching people with “Acting as” and moving the clock when a step says so.</p>
      ${SCENARIOS.map(s => `<div class="scn"><div class="row"><b>${esc(s.title)}</b><span class="sp"></span><span class="chip">${esc(USERS[s.user].name)}</span></div><p class="help">${esc(s.why)}</p><ol>${s.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol><div><button class="btn btn-p btn-sm" data-a="loadScenario" data-id="${s.id}">Load scenario</button></div></div>`).join('')}`,
    foot: `${cancelBtn('Close')}<button class="btn" data-a="reset">Reset all data</button>`
  }),

  guide: () => ({
    title: 'Button layout rules used in this prototype', size: 'l',
    body: `<div class="grid2"><div class="card"><h3 style="margin-bottom:var(--sp-2)">Before (current Wrench toolbar)</h3><ul class="pr-list"><li>12+ flat buttons in one toolbar above the grid.</li><li>User must select a row first, then scan for an enabled button.</li><li>Disabled buttons give no reason until clicked.</li><li>Destructive actions (Obsolete, Remove) sit next to everyday actions.</li><li>No hint about which step comes next.</li></ul></div>
      <div class="card"><h3 style="margin-bottom:var(--sp-2)">After (this prototype)</h3><ol class="pr-list">
        <li><b>One primary button</b>, top-right, labelled with the next lifecycle step (“Publish tender”, “Open technical bid”, “Issue PO”).</li>
        <li><b>At most two secondary buttons</b> beside it. Actions the user has no permission for are hidden here.</li>
        <li><b>“More” menu</b> holds the rest, grouped (Tender · Evaluation &amp; award · Records), with the disabled reason written under each item.</li>
        <li><b>Destructive actions last</b>, red, separated by a divider, always confirmed with the consequence spelled out.</li>
        <li><b>Gate line</b> under the primary button explains a date or status block, with a countdown.</li>
        <li><b>Row actions stay on the row</b> (Accept / Reject on each bid). <b>Bulk actions</b> appear only after selecting vendors.</li>
        <li><b>Forms</b> use a sticky footer: Close left; Back, Save draft, Next or Submit right.</li></ol></div></div>
      <div class="bn"><div>Disabled buttons stay focusable. Hover, focus or click them to read why they are disabled.</div></div>`,
    foot: `<span class="sp"></span><button class="btn btn-p" data-a="mClose">Got it</button>`
  }),

  invite: c => {
    const t = curT();
    return { title: `Invite vendors — ${t.id}`, size: 'l', body: `${mErr(c)}<p class="info">Project P-1042 · ${esc(t.desc)} · ${esc(t.spec)} · ${esc(t.loc)}${t.attachments.some(a => ['Tender Invitation', 'NDA Requisition'].includes(a.purpose)) ? ` · Attachments sent: ${t.attachments.filter(a => ['Tender Invitation', 'NDA Requisition'].includes(a.purpose)).map(a => esc(a.name)).join(', ')}` : ''}</p>
      ${vendorPickTable(t, c, inviteElig)}${mailFields(c, `Invitation to tender ${t.id} — ${t.desc}`, `Dear {VendorName},\nYou are invited to tender for ${t.desc}. Bid submission closes on ${fdt(t.sub)}.\nUse Accept or Reject in SmartProject to respond.`)}`,
      foot: `${cancelBtn()}<button class="btn btn-p" data-a="doInvite">Invite</button>` };
  },
  publish: c => {
    const t = curT();
    return { title: `Publish Tender — ${t.id} (Rev ${t.rev})`, size: 'l', body: `${mErr(c)}${t.status === 'Revised' ? `<div class="bn bn-warn"><div>Republish: every vendor can be selected again. Vendors must fetch details from the previous revision and resubmit.</div></div>` : ''}
      <p class="info"><b>Tender details</b> · ${esc(t.desc)} · ${TYPE_SHORT[t.type]} · Submission ${fdt(t.sub)} · Opening ${fdt(t.open)}</p>
      <div class="row"><b class="sm">Vendor details</b><span class="sp"></span><label class="cbx sm"><input type="checkbox" data-a="mToggle" data-k="invitedOnly"${c.invitedOnly ? ' checked' : ''}> Show Invited Vendors Only</label></div>
      ${vendorPickTable(t, Object.assign({}, c, { filter: c.invitedOnly ? r => !!r.invitedAt : null }), pubElig, (r, why) => `<td>${r.ndaReq ? (r.ndaSub ? 'Submitted' : '<span class="bad">Not submitted</span>') : '<span class="muted">Not requested</span>'}</td><td><input type="checkbox" data-a="mAtt" data-code="${r.code}"${t.type === 'T' || c.att.includes(r.code) ? ' checked' : ''}${t.type === 'T' || why ? ' disabled' : ''} aria-label="Attachment mandatory"></td>`, '<th>NDA</th><th>Attachment mandatory</th>')}
      ${mailFields(c, `Tender ${t.id} ${t.status === 'Revised' ? `republished (Rev ${t.rev})` : 'published'} — ${t.desc}`, `Dear {VendorName},\nTender ${t.id} is ${t.status === 'Revised' ? 'republished' : 'published'}. Submit your bid in SmartProject by ${fdt(t.sub)}.`)}`,
      foot: `${cancelBtn()}<button class="btn btn-p" data-a="doPublish">Publish</button>` };
  },
  remind: c => {
    const t = curT();
    return { title: `Bid Submission Reminder — ${t.id}`, body: `${mErr(c)}${vendorPickTable(t, Object.assign({}, c, { filter: r => isPublishedTo(r) }), (tt, r) => (t.bids[r.code] && t.bids[r.code].cur.submittedAt && t.bids[r.code].cur.rev === t.rev ? 'Already submitted' : ''), r => `<td>${r.lastReminder ? fdt(r.lastReminder) : '<span class="muted">—</span>'}</td>`, '<th>Last reminder</th>')}
      <div class="f"><span class="lb">Reminder email preview</span><div class="info">Reminder: ${t.id} bid submission closes ${fdt(t.sub)}. Dear {VendorName}, please submit your bid for ${esc(t.desc)} before the deadline.</div></div>
      <p class="help">Also sent to the internal distribution list (${esc(t.settings.idl)}), additional contacts and notified users.</p>`, foot: `${cancelBtn()}<button class="btn btn-p" data-a="doRemind">Send</button>` };
  },
  resub: c => {
    const t = curT(), scopes = resubScopes(t);
    const elig = (tt, r) => (['Submitted', 'Resubmission'].includes(r.status) ? '' : 'Vendor has not submitted a bid');
    return { title: `${c.decline ? 'Cancel Resubmission' : 'Resubmit Bid'} — ${t.id}`, size: 'l', body: `${mErr(c)}
      ${c.decline ? '' : `<div class="f"><span class="lb">What should the vendor resubmit?</span><div class="opt" role="radiogroup">${scopes.map(s => `<label><input type="radio" name="rs-scope" data-a="mScope" data-k="${s}"${c.scope === s ? ' checked' : ''}> ${SCOPE_LABEL[s]}</label>`).join('')}</div><span class="help">${c.scope === 'T' ? 'Only technical documents are requested; rates stay locked.' : c.scope === 'C' ? 'Commercial documents and rates are requested.' : 'The vendor may update rates and documents.'}</span></div>
      <div class="f" style="max-width:320px"><label for="rs-due">Resubmission Date</label><input id="rs-due" type="datetime-local" class="in" data-mf="due" value="${c.due || ''}" min="${db.now}"><span class="help">The vendor may resubmit until this date only. Leave empty for no deadline — then no further request is allowed while this one is open.</span></div>`}
      ${vendorPickTable(t, Object.assign({}, c, { filter: r => (c.decline ? r.status === 'Resubmission' : ['Submitted', 'Resubmission'].includes(r.status)) }), elig, r => `<td>${r.resub ? `${SCOPE_LABEL[r.resub.scope]}${r.resub.due ? ` · due ${fdt(r.resub.due)}` : ' · no due date'}` : '<span class="muted">—</span>'}</td>`, '<th>Active request</th>')}
      ${mailFields(c, `${t.id} — ${c.decline ? 'resubmission cancelled' : 'bid resubmission requested'}`, c.decline ? 'Dear {VendorName},\nThe resubmission request for this tender is cancelled.' : 'Dear {VendorName},\nPlease resubmit your bid details in SmartProject before the resubmission date.')}`,
      foot: `${cancelBtn()}<button class="btn btn-p" data-a="doResub">Send</button>` };
  },
  reject: c => ({ title: `Reject ${STAGE[c.s].toLowerCase()} bid — ${V(c.code).name}`, size: 's', body: `${mErr(c)}<div class="f"><label for="rj">Rejection comments <span class="req">*</span></label><textarea id="rj" class="in" data-mf="remarks" placeholder="Why is this bid rejected?">${esc(c.remarks || '')}</textarea></div>`, foot: `${cancelBtn()}<button class="btn btn-df" data-a="doRejectEval">Reject bid</button>` }),
  docs: c => {
    const t = curT(), b = t.bids[c.code].cur;
    const list = b.docs.filter(d => d.purpose === 'Bid Submission');
    return { title: `Vendor Uploads — ${V(c.code).name}`, drawer: true, body: list.length ? `<div class="tw"><table class="tbl"><thead><tr><th>Description</th><th>File name</th><th>Rev</th><th>Version</th><th></th></tr></thead><tbody>${list.map(d => `<tr><td>${esc(d.desc)}</td><td>${esc(d.name)}</td><td>${d.rev}</td><td>v${d.ver}</td><td class="num"><button class="btn btn-sm" data-a="dl">Download</button> <button class="btn btn-g btn-sm" data-a="dlPrev" data-ver="${d.ver}">Get previous</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No documents.</p>', foot: `<span class="sp"></span><button class="btn" data-a="mClose">Close</button>` };
  },
  reco: c => {
    const t = curT(), rows = submittedRows(t);
    return { title: `Recommendation Details — ${t.id}`, size: 'l', body: `${mErr(c)}${t.pos.length ? '<div class="bn bn-lock">Recommendation cannot be modified after PO is issued</div>' : ''}
      <div class="tw"><table class="tbl"><thead><tr><th class="chk"></th><th>Vendor</th>${stages(t).map(s => `<th>${STAGE[s]}</th>`).join('')}<th class="num">Grand total</th></tr></thead><tbody>${rows.map(r => `<tr class="${c.sel.includes(r.code) ? 'sel' : ''}"><td class="chk"><input type="checkbox" data-a="mSel" data-code="${r.code}"${c.sel.includes(r.code) ? ' checked' : ''} aria-label="Recommend ${esc(V(r.code).name)}"></td><td><b>${esc(V(r.code).name)}</b></td>${stages(t).map(s => `<td>${opened(t, s) ? evalPill(evalStatus(t, s, r.code)) : pill('Not Opened')}</td>`).join('')}<td class="num">${money(bidTotal(t, r.code))}</td></tr>`).join('')}</tbody></table></div>
      ${c.sel.some(code => stages(t).some(s => t.evals[s][code] && t.evals[s][code].status === 'Rejected')) ? '<div class="bn bn-warn">A selected vendor was rejected in evaluation. Recommending is allowed but will be visible to the client.</div>' : ''}
      <div class="f"><span class="lb">Attachments (comparison sheets, recommendation letter)</span>${c.files.length ? `<ul class="checks">${c.files.map((f, i) => `<li>📄 ${esc(f)} <button class="link sm" data-a="mRmFile" data-i="${i}">Remove</button></li>`).join('')}</ul>` : '<p class="help">No attachments yet.</p>'}
        <div class="row"><input id="rc-file" class="in in-sm" style="flex:1" placeholder="File name, e.g. recommendation-letter.pdf" data-mf="file" value="${esc(c.file || '')}"><button class="btn btn-sm" data-a="mAddFile">Attach</button></div></div>
      <p class="help">Saving at least one vendor sets the tender to Recommended. Removing all vendors returns it to Bid Evaluation.</p>`,
      foot: `${cancelBtn()}<button class="btn" data-a="recoMail">Send Mail</button><button class="btn btn-p" data-a="doReco">Save</button>` };
  },
  notify: c => {
    const t = curT(), sel = c.kind === 'sel';
    const elig = (tt, r) => (['LOI Issued', 'Bid Rejected'].includes(r.status) ? 'LOI for bid selection/rejection cannot be modified in current vendor status' : r.status === 'Submitted' || t.reco.vendors.includes(r.code) ? '' : 'LOI for bid selection/rejection cannot be modified in current vendor status');
    return { title: `${sel ? 'Notify Bid Selection' : 'Notify Bid Rejection'} — ${t.id}`, size: 'l', body: `${mErr(c)}<p class="info">Project P-1042 · ${esc(t.desc)} · ${esc(t.spec)} · ${esc(t.loc)}</p>
      ${sel ? `<label class="cbx sm"><input type="checkbox" data-a="mToggle" data-k="recoOnly"${c.recoOnly ? ' checked' : ''}> Show Recommended Vendors only</label>` : ''}
      ${vendorPickTable(t, Object.assign({}, c, { filter: r => isPublishedTo(r) && (!sel || !c.recoOnly || t.reco.vendors.includes(r.code)) }), elig, r => `<td>${t.reco.vendors.includes(r.code) ? pill('Recommended') : '<span class="muted">—</span>'}</td><td class="num">${money(bidTotal(t, r.code))}</td>`, '<th>Recommendation</th><th class="num">Total</th>')}
      ${mailFields(c, sel ? `${t.id} — your bid is selected` : `${t.id} — bid outcome`, sel ? 'Dear {VendorName},\nWe are pleased to inform you that your bid has been selected. A Letter of Intent follows.' : 'Dear {VendorName},\nThank you for your bid. We regret that it has not been selected.')}
      <p class="help">To: selected vendors · CC: additional points of contact, notify users, tender managers, internal distribution list.</p>`,
      foot: `${cancelBtn()}<button class="btn ${sel ? 'btn-p' : 'btn-df'}" data-a="doNotify">Notify</button>` };
  },
  po: c => {
    const t = curT();
    const rows = submittedRows(t).filter(r => !c.recoOnly || t.reco.vendors.includes(r.code));
    const b = c.vendor && t.bids[c.vendor] ? t.bids[c.vendor].cur : null;
    const lines = rateItems(t).map(i => { const done = poQtyIssued(t, i.code), left = Math.max(0, i.qty - done), rate = b ? b.rates[i.code] : undefined; return { i, done, left, rate }; }).filter(x => !c.remainingOnly || x.left > 0);
    const total = lines.reduce((s, x) => s + (c.lines[x.i.code] && c.lines[x.i.code].on && x.rate !== undefined ? Number(c.lines[x.i.code].qty || 0) * Number(x.rate) : 0), 0);
    if (c.step === 2) return { title: `PO Details — ${V(c.vendor).name}`, size: 'l', body: `${mErr(c)}<div class="fg fg3">
        <div class="f"><span class="lb">Reference number</span><span class="b">PO-2026-0${db.seq.po}</span></div><div class="f"><span class="lb">Type</span><span>PO</span></div><div class="f"><span class="lb">Issued to</span><span>${esc(V(c.vendor).name)} 🔒</span></div>
        <div class="f"><label for="po-desc">PO description</label><input id="po-desc" class="in" data-mf="descr" value="${esc(c.descr ?? t.desc)}"></div>
        <div class="f"><label for="po-ord">Order number</label><input id="po-ord" class="in" data-mf="order" value="${esc(c.order || '')}"></div>
        <div class="f"><label for="po-pd">Payment days <span class="req">*</span></label><input id="po-pd" class="in" type="number" min="1" data-mf="payDays" value="${esc(c.payDays ?? '')}"></div>
        <div class="f"><span class="lb">Currency</span><span>${b.currency}<span class="cell-sub">Defaults to the vendor’s bid currency</span></span></div><div class="f"><span class="lb">Cost code</span><span>CC-3.2 (inherited from tender)</span></div>
      </div>
      <div class="tw"><table class="tbl"><thead><tr><th>Code</th><th>Description</th><th class="num">PO qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>${lines.filter(x => c.lines[x.i.code] && c.lines[x.i.code].on).map(x => `<tr><td>${x.i.code}</td><td>${esc(x.i.desc)}</td><td class="num">${money(c.lines[x.i.code].qty)}</td><td class="num">${money(x.rate)}</td><td class="num">${money(c.lines[x.i.code].qty * x.rate)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4" class="num">Total</td><td class="num">${b.currency} ${money(total)}</td></tr></tfoot></table></div>`,
      foot: `${cancelBtn()}<button class="btn" data-a="poBack">◂ Back</button><button class="btn btn-p" data-a="doPO">Save — issue PO</button>` };
    return { title: 'Issue PO — Select Vendors', size: 'l', body: `${mErr(c)}
      <div class="row">${t.settings.recoMandatory ? '<label class="cbx sm"><input type="checkbox" checked disabled> Show Recommended Vendors 🔒</label><span class="help">Vendor Recommendation is mandatory to Issue PO</span>' : `<label class="cbx sm"><input type="checkbox" data-a="mToggle" data-k="recoOnly"${c.recoOnly ? ' checked' : ''}> Show Recommended Vendors</label>`}</div>
      <div class="tw"><table class="tbl"><thead><tr><th class="chk"></th><th>Vendor</th><th>Status</th><th>Bid currency</th><th class="num">Total</th></tr></thead><tbody>${rows.map(r => `<tr class="${c.vendor === r.code ? 'sel' : ''}"><td class="chk"><input type="radio" name="po-v" data-a="poVendor" data-code="${r.code}"${c.vendor === r.code ? ' checked' : ''} aria-label="${esc(V(r.code).name)}"></td><td><b>${esc(V(r.code).name)}</b></td><td>${t.reco.vendors.includes(r.code) ? pill('Recommended') : pill(r.status)}</td><td>${t.bids[r.code].cur.currency}</td><td class="num">${money(bidTotal(t, r.code))}</td></tr>`).join('') || '<tr><td colspan="5" class="muted" style="text-align:center">No vendors match. Recommend vendors first or clear the filter.</td></tr>'}</tbody></table></div>
      ${c.vendor ? `<div class="tw"><table class="tbl"><thead><tr><th class="chk"></th><th>Item</th><th class="num">Tender qty</th><th class="num">Already ordered</th><th class="num">Remaining</th><th class="num">PO qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>
        ${lines.map(x => { const L = c.lines[x.i.code] || {}; const why = x.left <= 0 ? 'PO already issued for full quantity' : x.rate === undefined || x.rate === '' ? 'Vendor did not quote a rate' : ''; return `<tr class="${why ? 'dim' : ''}"><td class="chk"><input type="checkbox" data-a="poLine" data-code="${x.i.code}"${L.on && !why ? ' checked' : ''}${why ? ' disabled' : ''} aria-label="Include ${x.i.code}"></td><td><b>${x.i.code}</b> ${esc(x.i.desc)}${why ? `<span class="cell-sub">${esc(why)}</span>` : ''}</td><td class="num">${money(x.i.qty)}</td><td class="num">${money(x.done)}</td><td class="num">${money(x.left)}</td><td class="num"><input class="in in-sm num" style="width:100px" type="number" min="0" data-mq="${x.i.code}" value="${L.qty ?? ''}"${!L.on || why ? ' disabled' : ''} aria-label="PO quantity ${x.i.code}"></td><td class="num">${money(x.rate)}</td><td class="num">${L.on && !why ? money((L.qty || 0) * x.rate) : '—'}</td></tr>`; }).join('')}
        </tbody><tfoot><tr><td colspan="7" class="num">Total</td><td class="num">${money(total)}</td></tr></tfoot></table></div><p class="help">Rate-only items have no quantity and are not ordered here. PO quantity may differ from the tender quantity.</p>` : '<p class="help">Select a vendor to choose items.</p>'}`,
      foot: `${cancelBtn()}<button class="btn btn-p" data-a="poNext">Next ▸</button>` };
  },
  addVendor: c => {
    const t = wT() || curT();
    const list = VENDORS.filter(v => !t.vendors.some(r => r.code === v.code) && (!c.match || v.spec === t.spec));
    return { title: 'Search Vendors', size: 'l', body: `<div class="row"><label class="cbx sm"><input type="checkbox" data-a="mToggle" data-k="match"${c.match ? ' checked' : ''}> Only vendors with specialisation “${esc(t.spec)}”</label></div>
      ${list.length ? `<div class="tw"><table class="tbl"><thead><tr><th class="chk"></th><th>Vendor</th><th>Specialisation</th><th>Location</th><th>Prequal</th><th>Email</th></tr></thead><tbody>${list.map(v => `<tr><td class="chk"><input type="checkbox" data-a="mSel" data-code="${v.code}"${c.sel.includes(v.code) ? ' checked' : ''} aria-label="Select ${esc(v.name)}"></td><td><b>${esc(v.name)}</b><span class="cell-sub">${v.code}</span></td><td>${v.spec}</td><td>${v.loc}</td><td>${pill(v.prequal, v.prequal === 'Approved' ? 'p-green' : 'p-amber')}</td><td>${v.email ? esc(v.email) : '<span class="bad">⚠ None — cannot be invited</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty"><h4>No more vendors to add</h4><p>Clear the specialisation filter to see all certified vendors.</p></div>'}`,
      foot: `${cancelBtn()}<button class="btn btn-p" data-a="doAddVendors">Add ${c.sel.length || ''}</button>` };
  },
  boq: c => {
    const t = wT();
    const groups = [...new Set(BOQ.map(b => b.grp))];
    return { title: 'Search BOQ', size: 'l', body: `<div class="tw" style="max-height:60vh"><table class="tbl"><thead><tr><th class="chk"></th><th>Code</th><th>Description</th><th>UOM</th><th class="num">Qty</th><th>Availability</th></tr></thead><tbody>${groups.map(g => `<tr class="grp"><td></td><td colspan="5">${g}</td></tr>${BOQ.filter(b => b.grp === g).map(b => { const other = itemInOtherTender(t, b.code); const why = t.items.includes(b.code) ? 'Already in this tender' : other ? `In tender ${other.id}` : ''; return `<tr class="${why ? 'dim' : ''}"><td class="chk"><input type="checkbox" data-a="mSel" data-code="${b.code}"${c.sel.includes(b.code) ? ' checked' : ''}${why ? ' disabled' : ''} aria-label="Select ${b.code}"></td><td>${b.code}</td><td>${esc(b.desc)}</td><td>${b.uom}</td><td class="num">${b.rateOnly ? 'NA' : money(b.qty)}</td><td>${why ? `<span class="xs">${esc(why)}</span>` : '<span class="ok xs">Available</span>'}</td></tr>`; }).join('')}`).join('')}</tbody></table></div>`, foot: `${cancelBtn()}<button class="btn btn-p" data-a="doAddBoq">OK</button>` };

function go(view, extra = {}) { Object.assign(db.ui, { view, menu: null }, extra); render(); }
function markOpened(t, s, user) {
  const op = t.opening[s];
  op.by[user] = db.now;
  delete t.otp[`${s}:${user}`];
  const rule = s === 'T' ? t.settings.techRule : t.settings.commRule;
  const need = officers(t, s).length ? (rule === 'all' ? officers(t, s).length : 1) : 1;
  const cnt = Object.keys(op.by).length;
  if (cnt >= need) {
    op.done = db.now; op.doneBy = user;
    log(t, `${STAGE[s]} bid opened (${rule === 'all' ? 'Open By All' : 'Open By Any'}${t.settings.otp ? ', OTP verified' : ''})`);
    toast(`${STAGE[s]} bid opened. Evaluation can start.`);
  } else toast(`Verified. ${cnt} of ${need} officers have opened the ${STAGE[s].toLowerCase()} bid.`);
}
function setEval(t, s, code, status, remarks = '') {
  t.evals[s][code] = { status, remarks, by: db.user, at: db.now };
  log(t, `${STAGE[s]} bid of ${V(code).name} ${status === 'Approved' ? 'approved' : 'rejected'}${remarks ? `: ${remarks}` : ''}`);
  toast(`${V(code).name}: ${STAGE[s].toLowerCase()} bid ${status === 'Approved' ? 'approved' : 'rejected'}`);
}
function saveNewDraft() {
  const t = db.ui.draft;
  t.id = `T-2026-0${db.seq.tender++}`; t.createdOn = db.now; t.createdBy = db.user;
  db.tenders.unshift(t); db.ui.id = t.id; db.ui.draft = null;
  log(t, 'Tender created as Draft');
  return t;
}
function wGuardStep1() {
  const t = wT(), e = wValidate(t, 1);
  if (Object.keys(e).length) { db.ui.wErr = e; db.ui.step = 1; toast('Fix Tender Information before continuing', 'err'); render(); return false; }
  if (!db.ui.id) { saveNewDraft(); toast(`Tender saved as Draft (${db.ui.id})`); }
  return true;
}
