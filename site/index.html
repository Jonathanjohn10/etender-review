    return text ? `${kind} "${text}"` : kind;
  },
  anchorFor(el, x, y) {
    const sc = CM.scopeOf(el);
    if (!sc) return null;
    const a = CM.cand(el, sc.root);
    const sel = CM.selFor(a, sc.root);
    let idx = 0;
    if (sel !== ':scope') { try { idx = Math.max(0, [...sc.root.querySelectorAll(sel)].indexOf(a)); } catch (e) { idx = 0; } }
    const r = a.getBoundingClientRect();
    const cl = v => Math.min(1, Math.max(0, v));
    if (x == null) { x = r.left + r.width / 2; y = r.top + r.height / 2; }
    return {
      scope: sc.scope, sel, idx,
      fx: r.width ? +cl((x - r.left) / r.width).toFixed(4) : 0.5, fy: r.height ? +cl((y - r.top) / r.height).toFixed(4) : 0.5,
      label: CM.label(a, sc.root, sc.scope), px: Math.round(x + window.scrollX), py: Math.round(y + window.scrollY), vw: window.innerWidth, vh: window.innerHeight,
      _el: a
    };
  },
  root(scope) { const all = $$(CM.ROOTS[scope] || '#main'); return all.length ? all[all.length - 1] : null; },
  resolve(a) {
    const root = CM.root(a.scope);
    if (!root) return null;
    if (a.sel === ':scope') return root;
    try { const l = root.querySelectorAll(a.sel); return l[a.idx] || l[0] || null; } catch (e) { return null; }
  },
  // Where a pin is right now. st: note | other | closed | covered | ghost | missing | ok
  pinState(c) {
    if (c.kind === 'note' || !c.anchor) return { st: 'note' };
    const a = c.anchor;
    if (!CM.sameScreen(c)) return { st: 'other' };
    const root = CM.root(a.scope);
    if (!root) return { st: 'closed' };
    if (a.scope !== 'modal' && modals.length) return { st: 'covered' };
    const el = CM.resolve(a);
    if (!el) return a.scope === 'main' ? { st: 'ghost', x: a.px - window.scrollX, y: a.py - window.scrollY, root } : { st: 'missing' };
    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) return a.scope === 'main' ? { st: 'ghost', x: a.px - window.scrollX, y: a.py - window.scrollY, root } : { st: 'missing' };
    return { st: 'ok', x: r.left + r.width * a.fx, y: r.top + r.height * a.fy, el, root };
  },
  visible(p, scope) {
    if (p.x < 0 || p.y < 0 || p.x > window.innerWidth || p.y > window.innerHeight) return false;
    if (scope === 'main') { const pb = $('#app .proto'); if (pb && p.y < pb.getBoundingClientRect().bottom + 4) return false; }
    if (scope === 'modal' || scope === 'menu' || scope === 'nav') { const r = p.root.getBoundingClientRect(); if (p.x < r.left - 2 || p.x > r.right + 2 || p.y < r.top - 2 || p.y > r.bottom + 2) return false; }
    if (CM.st.open && CM.overlay()) { if (p.x < 340) return false; }
    return true;
  },
  overlay() { return window.matchMedia('(max-width:1179px)').matches; },

  /* ---------- armed mode ---------- */
  arm(move) {
    if (CM.comp && CM.comp.mode === 'pin') CM.closeComposer();
    CM.armed = { move: move || null };
    CM.ui.menu = null; CM.ui.exp = false;
    if (!CM.st.open) { CM.st.open = true; CM.save(); }
    document.body.classList.add('cm-armed');
    const b = $('#cm-banner');
    b.innerHTML = `<span aria-hidden="true">📍</span><span>${move ? `Click where pin #${move} should go` : 'Click anywhere to place a pin'}</span><kbd>Esc</kbd><button type="button" data-cm="armCancel">Cancel</button>`;
    b.hidden = false;
    CM.render();
    CM.syncBar();
  },
  disarm() {
    CM.armed = null;
    document.body.classList.remove('cm-armed');
    $('#cm-banner').hidden = true;
    $('#cm-hover').hidden = true; $('#cm-hover-lbl').hidden = true;
    CM.render();
  },
  hoverAt(t) {
    const hb = $('#cm-hover'), hl = $('#cm-hover-lbl');
    const sc = CM.scopeOf(t);
    if (!sc) { hb.hidden = true; hl.hidden = true; return; }
    const el = CM.cand(t, sc.root), r = el.getBoundingClientRect();
    Object.assign(hb.style, { left: r.left - 3 + 'px', top: r.top - 3 + 'px', width: r.width + 6 + 'px', height: r.height + 6 + 'px' });
    hl.textContent = CM.label(el, sc.root, sc.scope);
    Object.assign(hl.style, { left: Math.max(4, r.left - 3) + 'px', top: Math.max(4, r.top - 24) + 'px' });
    hb.hidden = false; hl.hidden = false;
  },
  place(e) {
    if (e.button) return;
    const a = CM.anchorFor(e.target, e.clientX, e.clientY);
    if (!a) { toast('Cannot pin here. Click inside the page, a dialog, a menu or the top bars.', 'warn'); return; }
    delete a._el;
    if (CM.armed.move) {
      const n = CM.armed.move;
      CM.update(n, { anchor: a, screen: CM.screen() });
      CM.st.sel = n; CM.save();
      CM.disarm(); CM.reposition();
      toast(`Pin #${n} moved`);
      return;
    }
    CM.ghost = { anchor: a, screen: CM.screen() };
    CM.comp = { mode: 'pin', cat: CM.st.lastCat || 'flow', text: '', name: '', err: '' };
    CM.disarm();
    CM.renderComposer();
    CM.reposition();
    const ta = $('#cm-text'); if (ta) ta.focus({ preventScroll: true });
  },

  /* ---------- composer ---------- */
  openNote() {
    if (CM.comp && CM.comp.mode === 'pin') CM.closeComposer();
    CM.comp = { mode: 'note', cat: CM.st.lastCat || 'flow', text: '', name: '', err: '', screen: CM.screen() };
    CM.st.open = true; CM.save();
    CM.render(); CM.syncBar();
    const ta = $('#cm-text'); if (ta) ta.focus();
  },
  closeComposer() {
    CM.comp = null; CM.ghost = null;
    $('#cm-composer').hidden = true; $('#cm-composer').innerHTML = '';
    CM.render(); CM.reposition();
  },
  composerHtml() {
    const c = CM.comp, next = CM.api ? 'New comment' : '#' + (CM.st.seq + 1);
    const s = c.mode === 'pin' ? CM.ghost.screen : c.screen;
    const on = c.mode === 'pin' ? ` · on <b>${esc(CM.ghost.anchor.label)}</b>` : ' · <b>note, no pin</b>';
    const shortWhere = `${esc(s.userName.split(' ')[0])}${s.id && !['list', 'vlist'].includes(s.view) ? ` · ${esc(s.id)} ${esc(s.tenderStatus || '')}` : ''} · ${esc(s.view === 'tender' ? (CM.TABS[s.tab] || s.tab) + ' tab' : s.view === 'vtender' ? (CM.VTABS[s.vtab] || s.vtab) + ' tab' : s.view === 'wizard' ? 'Wizard step ' + s.step : 'List')}${s.modal ? ` · dialog “${esc(s.modal.title || s.modal.key)}”` : ''}`;
    return `<div class="cm-cctx">${next}${on} · ${shortWhere}</div>
      <div class="cm-cats" role="group" aria-label="Category">${CM.CATS.map(([k, l]) => `<button type="button" class="cm-chip" data-cm="compCat" data-k="${k}" aria-pressed="${c.cat === k}">${l}</button>`).join('')}</div>
      ${CM.st.author ? '' : `<input id="cm-name" class="cm-in" style="margin-bottom:var(--sp-2)" placeholder="Your name (asked once, remembered)" aria-label="Your name" maxlength="40" value="${esc(c.name)}">`}
      <textarea id="cm-text" class="cm-ta" maxlength="2000" placeholder="What is wrong or different from the expected flow?" aria-label="Comment">${esc(c.text)}</textarea>
      <div class="cm-cf"><span class="cm-err" id="cm-err" role="alert">${esc(c.err || '')}</span><button type="button" class="btn btn-g btn-sm" data-cm="cancel">Cancel</button><button type="button" class="btn btn-sm cm-primary" data-cm="post">Post</button></div>
      <div class="cm-hint">Ctrl + Enter to post · Esc to cancel</div>`;
  },
  renderComposer() {
    const box = $('#cm-composer');
    if (!CM.comp || CM.comp.mode !== 'pin') { box.hidden = true; box.innerHTML = ''; return; }
    const keep = CM.focusSnap();
    box.innerHTML = CM.composerHtml();
    box.hidden = false;
    CM.focusRestore(keep);
  },
  post() {
    const c = CM.comp; if (!c) return;
    const text = c.text.trim(), name = (c.name || '').trim();
    if (!CM.st.author && !name) { c.err = 'Your name is required'; CM.refreshErr(); const f = $('#cm-name'); if (f) f.focus(); return; }
    if (!text) { c.err = 'Comment text is required'; CM.refreshErr(); const f = $('#cm-text'); if (f) f.focus(); return; }
    if (!CM.st.author) CM.st.author = name;
    CM.st.lastCat = c.cat;
    const item = c.mode === 'pin'
      ? CM.add({ kind: 'pin', cat: c.cat, text, author: CM.st.author, screen: CM.ghost.screen, anchor: CM.ghost.anchor })
      : CM.add({ kind: 'note', cat: c.cat, text, author: CM.st.author, screen: c.screen, anchor: null });
    CM.comp = null; CM.ghost = null;
    CM.st.sel = item.n; CM.st.open = true;
    if (CM.st.filter === 'resolved') CM.st.filter = 'all';
    CM.save();
    $('#cm-composer').hidden = true; $('#cm-composer').innerHTML = '';
    CM.render(); CM.syncBar(); CM.reposition();
    CM.scrollItem(item.n);
    toast(`Comment #${item.n} added`);
  },
  refreshErr() {
    const e = $('#cm-err');
    if (e) e.textContent = CM.comp ? CM.comp.err || '' : '';
    else CM.render();
  },

  /* ---------- navigation ---------- */
  goTo(n) {
    const c = CM.get(n); if (!c) return;
    const s = c.screen;
    modals.length = 0; db.ui.menu = null;
    if (!USERS[s.user]) { toast('That user is not in this prototype', 'warn'); return; }
    db.user = s.user;
    const buyer = USERS[s.user].side === 'buyer';
    const needsT = ['tender', 'vtender'].includes(s.view) || (s.view === 'wizard' && s.id);
    if (needsT && !T(s.id)) {
      db.ui.view = buyer ? 'list' : 'vlist';
      toast(`Tender ${s.id} is not in the current data (reset or scenario). Showing the list.`, 'warn', 6000);
    } else if (s.view === 'wizard' && !s.id && !db.ui.draft) {
      db.ui.view = 'list';
      toast('That comment was on an unsaved new tender. Start “Create tender” to see it.', 'warn', 6000);
    } else {
      Object.assign(db.ui, { view: s.view, id: s.id, tab: s.tab || db.ui.tab, vtab: s.vtab || db.ui.vtab, step: s.step || db.ui.step });
    }
    if (c.anchor && c.anchor.scope === 'nav') db.ui.navOpen = true;
    render();
    if (s.modal && (!c.anchor || c.anchor.scope === 'modal') && MODALS[s.modal.key] && db.ui.view === s.view) {
      try { MODALS[s.modal.key](s.modal.ctx || {}); openModal(s.modal.key, s.modal.ctx || {}); }
      catch (e) { modals.length = 0; render(); toast(`Could not reopen the dialog “${s.modal.title || s.modal.key}”`, 'warn'); }
    }
    CM.st.sel = n; CM.save();
    CM.render(); CM.reposition();
    CM.revealPin(n);
  },
  revealPin(n) {
    const c = CM.get(n); if (!c) return;
    const p = CM.pinState(c);
    if (p.st === 'ok' && !CM.visible(p, c.anchor.scope)) {
      p.el.scrollIntoView({ block: 'center', behavior: 'auto' });
      CM.reposition();
    }
  },
  scrollItem(n) { const el = $(`#cm-drawer .cm-it[data-n="${n}"]`); if (el) el.scrollIntoView({ block: 'nearest' }); },

  /* ---------- export / import ---------- */
  exportMd() {
    const items = [...CM.st.items].sort((a, b) => a.n - b.n);
    const open = items.filter(i => i.status === 'open').length;
    const d = new Date();
    const lines = [`# E-Tendering prototype — review comments · ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} · ${open} open, ${items.length - open} resolved`, ''];
    const w = iso => { const x = new Date(iso); return `${x.getDate()} ${MON[x.getMonth()]} ${p2(x.getHours())}:${p2(x.getMinutes())}`; };
    items.forEach(c => {
      const imp = c.imported ? ` (imported from ${c.imported.from} #${c.imported.n})` : '';
      lines.push(`${c.n}. [${CM.catLabel(c.cat, true)}] ${c.status === 'open' ? 'OPEN' : 'RESOLVED'} — ${c.kind === 'note' ? 'Note (no pin) — ' : ''}${c.author}${imp}, ${w(c.ts)}`);
      lines.push(`   Where: ${CM.where(c)}`);
      String(c.text).split(/\r?\n/).forEach(l => lines.push(`   > ${l}`));
      (c.replies || []).forEach(r => lines.push(`   ↳ ${r.author}, ${w(r.ts)}: ${String(r.text).replace(/\r?\n/g, ' / ')}`));
      lines.push('');
    });
    return lines.join('\n').trimEnd() + '\n';
  },
  jsonString() {
    const o = Object.assign({}, CM.st);
    ['open', 'sel', 'filter', 'hidePins'].forEach(k => delete o[k]);
    return JSON.stringify(o, null, 2);
  },
  copyText(txt, okMsg) {
    const fallback = () => {
      const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? okMsg : 'Copy blocked by the browser. Use Download JSON instead.', ok ? 'ok' : 'warn');
    };
    try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(() => toast(okMsg), fallback); return; } } catch (e) { /* fall through */ }
    fallback();
  },
  download() {
    const d = new Date();
    const name = `etender-comments-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}.json`;
    const url = URL.createObjectURL(new Blob([CM.jsonString()], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`Downloaded ${name}`);
  },
  importText(txt) {
    let o;
    try { o = JSON.parse(txt); } catch (e) { o = null; }
    if (!o || o.v !== 1 || !Array.isArray(o.items)) { toast('Not a comments file', 'err'); return 0; }
    const sig = c => `${c.ts}|${c.author}|${c.text}`;
    const have = new Set(CM.st.items.map(sig));
    const haveImp = new Set(CM.st.items.filter(c => c.imported).map(c => `${c.imported.from}#${c.imported.n}`));
    let k = 0;
    [...o.items].sort((a, b) => a.n - b.n).forEach(src => {
      if (!src || typeof src.text !== 'string' || !src.screen) return;
      const origin = src.imported || { from: src.author, n: src.n };
      if (have.has(sig(src)) || haveImp.has(`${origin.from}#${origin.n}`)) return;
      CM.st.seq += 1;
      const it = Object.assign({}, src, { id: CM.uid(), n: CM.st.seq, imported: origin, replies: Array.isArray(src.replies) ? src.replies : [], status: src.status === 'resolved' ? 'resolved' : 'open' });
      CM.st.items.push(it);
      if (CM.api) CM.push('add', { item: it });
      have.add(sig(src)); haveImp.add(`${origin.from}#${origin.n}`);
      k++;
    });
    CM.save(); CM.render(); CM.syncBar(); CM.reposition();
    const from = o.author || (o.items[0] && o.items[0].author) || 'file';
    toast(k ? `Imported ${k} comment${k > 1 ? 's' : ''} from ${from}` : 'Nothing new to import — these comments are already here', k ? 'ok' : 'info');
    return k;
  },
  clearAll() {
    const n = CM.st.items.length;
    if (!n) return;
    ask({ title: 'Clear all comments?', text: `${n} comment${n > 1 ? 's' : ''} will be deleted. Numbers restart at 1.`, detail: 'Download JSON first if you want to keep them.', yes: 'Clear all', danger: true,
      onYes: () => { CM.st.items = []; CM.st.seq = 0; CM.st.sel = null; CM.save(); if (CM.api) CM.push('clear', {}); CM.render(); CM.syncBar(); CM.reposition(); toast('All comments cleared'); } });
  },

  /* ---------- rendering ---------- */
  barBtn() {
    const n = CM.st ? CM.st.items.filter(i => i.status === 'open').length : 0;
    const open = !!(CM.st && CM.st.open);
    return `<button class="pbtn" data-cm="toggle" aria-pressed="${open}" aria-label="Review comments, ${n} open" title="Review comments (C)">💬 Comments${n ? `<span class="cm-cnt">${n}</span>` : ''}</button>`;
  },
  syncBar() {
    const b = $('#app .proto [data-cm="toggle"]');
    if (b) b.outerHTML = CM.barBtn();
    document.body.classList.toggle('cm-open', !!CM.st.open);
  },
  focusSnap() {
    const a = document.activeElement;
    if (!a || !a.id || !a.id.startsWith('cm-')) return null;
    return { id: a.id, s: typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null, top: a.scrollTop };
  },
  focusRestore(k) {
    if (!k) return;
    const el = document.getElementById(k.id);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (k.s && el.setSelectionRange) { try { el.setSelectionRange(k.s[0], k.s[1]); } catch (e) { /* ignore */ } }
    el.scrollTop = k.top;
  },
  counts() {
    const it = CM.st.items;
    return { all: it.length, screen: it.filter(CM.sameScreenLoose).length, open: it.filter(i => i.status === 'open').length, resolved: it.filter(i => i.status === 'resolved').length };
  },
  // "This screen" ignores which dialog is open, so the filter stays stable while a modal opens and closes.
  sameScreenLoose(c) { const scope = c.anchor && c.anchor.scope !== 'modal' ? c.anchor.scope : 'main'; return CM.screenKey(c.screen, scope) === CM.screenKey(CM.screen(), scope); },
  filtered() {
    const f = CM.st.filter;
    return [...CM.st.items].filter(c => f === 'all' || (f === 'screen' && CM.sameScreenLoose(c)) || (f === 'open' && c.status === 'open') || (f === 'resolved' && c.status === 'resolved')).sort((a, b) => a.n - b.n);
  },
  itemHtml(c) {
    const sel = CM.st.sel === c.n, p = CM.pinState(c);
    const stateTxt = {
      other: `<span>On another screen</span><button type="button" class="cm-link" data-cm="goto" data-n="${c.n}">Go to this screen ↗</button>`,
      closed: `<span>${c.anchor && c.anchor.scope === 'menu' ? 'Pin is inside a menu that is closed' : 'Pin is in the Operations Panel, which is closed'}</span>`,
      covered: '<span>Pin hidden while a dialog is open</span>',
      ghost: '<span>Element no longer on this screen — pin shows its last position</span>',
      missing: '<span>Element no longer on this screen</span>'
    }[p.st];
    const offscreen = p.st === 'ok' && !CM.visible(p, c.anchor.scope) ? `<span>Pin is out of view</span><button type="button" class="cm-link" data-cm="reveal" data-n="${c.n}">Scroll to pin</button>` : '';
    const hiddenNote = CM.st.hidePins && ['ok', 'ghost'].includes(p.st) ? '<span>Pins hidden</span>' : '';
    const isEdit = CM.ui.edit === c.n, isCat = CM.ui.catEdit === c.n, menu = CM.ui.menu === c.n;
    const res = c.status === 'resolved';
    return `<div class="cm-it${sel ? ' sel' : ''}${res ? ' res' : ''}" role="listitem" tabindex="0" data-cm="select" data-n="${c.n}" data-cmh="${c.n}" aria-current="${sel}" aria-label="Comment ${c.n}">
      <div class="cm-num${c.kind === 'note' ? ' note' : ''}" title="${c.kind === 'note' ? 'Note, no pin' : 'Pin'}">${c.n}</div>
      <div class="cm-bd">
        <div class="cm-m"><span class="cm-cat ${c.cat}">${esc(CM.catLabel(c.cat))}</span>${c.kind === 'note' ? '<span>Note ·</span>' : ''}<span>${esc(c.author)} · ${esc(CM.when(c.ts))}</span>${res ? '<span class="cm-res-lbl">· Resolved</span>' : ''}${c.imported ? `<span>· imported from ${esc(c.imported.from)} #${c.imported.n}</span>` : ''}</div>
        ${isEdit ? `<textarea id="cm-edit" class="cm-ta" maxlength="2000" aria-label="Edit comment ${c.n}">${esc(CM.ui.editText)}</textarea>
          <div class="cm-cf"><span class="cm-err" id="cm-edit-err" role="alert"></span><button type="button" class="btn btn-g btn-sm" data-cm="editCancel">Cancel</button><button type="button" class="btn btn-sm cm-primary" data-cm="editSave" data-n="${c.n}">Save</button></div>`
          : `<div class="cm-txt">${esc(sel ? c.text : CM.cut(c.text, 160))}</div>`}
        ${isCat ? `<div class="cm-cats" role="group" aria-label="Change category">${CM.CATS.map(([k, l]) => `<button type="button" class="cm-chip" data-cm="setCat" data-n="${c.n}" data-k="${k}" aria-pressed="${c.cat === k}">${l}</button>`).join('')}</div>` : ''}
        <div class="cm-ctx">${esc(CM.where(c))}</div>
        ${stateTxt || offscreen || hiddenNote ? `<div class="cm-state">${stateTxt || offscreen || hiddenNote}</div>` : ''}
        ${sel ? `${(c.replies || []).map(r => `<div class="cm-rep"><div class="a">${esc(r.author)} · ${esc(CM.when(r.ts))}</div>${esc(r.text)}</div>`).join('')}
          <div class="cm-reply"><textarea id="cm-reply-${c.n}" class="cm-in" rows="1" style="height:32px;resize:none" placeholder="Write a reply…" aria-label="Reply to comment ${c.n}">${esc(CM.ui.reply[c.n] || '')}</textarea><button type="button" class="btn btn-sm btn-g" data-cm="replySend" data-n="${c.n}">Send</button></div>` : ''}
        <div class="cm-acts">
          ${sel ? '' : `<button type="button" class="cm-link" data-cm="reply" data-n="${c.n}">Reply${c.replies && c.replies.length ? ` (${c.replies.length})` : ''}</button>`}
          ${res ? `<button type="button" class="cm-link" data-cm="reopen" data-n="${c.n}">Reopen</button>` : `<button type="button" class="cm-link" data-cm="resolve" data-n="${c.n}">Resolve</button>`}
          ${p.st === 'other' && sel ? '' : ''}
          <button type="button" class="cm-more" data-cm="menu" data-n="${c.n}" aria-haspopup="menu" aria-expanded="${menu}" aria-label="More actions for comment ${c.n}">⋯</button>
          ${menu ? `<div class="cm-menu" role="menu">
            <button type="button" role="menuitem" data-cm="edit" data-n="${c.n}">Edit text</button>
            <button type="button" role="menuitem" data-cm="catEdit" data-n="${c.n}">Change category</button>
            ${c.kind === 'pin' ? `<button type="button" role="menuitem" data-cm="move" data-n="${c.n}">Move pin<small>${p.st === 'other' ? 'Go to its screen first, or place it here' : `Re-arms placement for #${c.n} only`}</small></button>` : ''}
            <button type="button" role="menuitem" data-cm="copyLink" data-n="${c.n}">Copy link<small>Copies “#${c.n} — who · where”</small></button>
            <hr><button type="button" role="menuitem" class="dng" data-cm="delete" data-n="${c.n}">Delete<small>Number ${c.n} is not reused</small></button></div>` : ''}
        </div>
      </div></div>`;
  },
  render() {
    const d = $('#cm-drawer');
    if (!d) return;
    document.body.classList.toggle('cm-open', !!CM.st.open);
    if (!CM.st.open) { d.innerHTML = ''; CM.renderComposer(); return; }
    const keep = CM.focusSnap();
    const listScroll = $('#cm-drawer .cm-list') ? $('#cm-drawer .cm-list').scrollTop : 0;
    const k = CM.counts(), f = CM.st.filter, list = CM.filtered();
    const note = CM.comp && CM.comp.mode === 'note';
    const fb = (key, l, n) => `<button type="button" class="cm-f" data-cm="filter" data-k="${key}" aria-pressed="${f === key}">${l} ${n}</button>`;
    d.innerHTML = `<div class="cm-h">
        <div class="cm-t"><span aria-hidden="true">💬</span><span>Review comments</span><small>${k.open} open · ${k.resolved} resolved</small><button type="button" class="cm-x" data-cm="close" aria-label="Close review comments">✕</button></div>
        <div class="cm-tools">${CM.armed ? `<button type="button" class="btn btn-sm cm-armed-btn" data-cm="armCancel">📍 Placing… (Esc)</button>` : `<button type="button" class="btn btn-sm cm-primary" data-cm="add" title="Add comment (N)">📍 Add comment</button>`}<button type="button" class="btn btn-sm" data-cm="note"${note ? ' aria-pressed="true"' : ''}>✎ Note (no pin)</button></div>
        <div class="cm-who">${CM.api ? `<span class="cm-sync${CM.online === false ? ' off' : ''}" title="${CM.online === false ? 'Comment server unreachable' : 'Comments are shared with everyone who has the link'}">${CM.online === false ? '● offline' : '● shared'}</span>` : ''}${CM.ui.who ? `<label for="cm-who" class="sm">Name</label><input id="cm-who" maxlength="40" value="${esc(CM.ui.whoText)}"><button type="button" class="cm-link" data-cm="whoSave">Save</button>` : CM.st.author ? `Commenting as <b>${esc(CM.st.author)}</b> · <button type="button" class="cm-link" data-cm="who">change</button>` : 'You will be asked for your name on the first comment'}</div>
      </div>
      <div class="cm-filters" role="group" aria-label="Filter comments">${fb('all', 'All', k.all)}${fb('screen', 'This screen', k.screen)}${fb('open', 'Open', k.open)}${fb('resolved', 'Resolved', k.resolved)}
        <button type="button" class="cm-link cm-eye" data-cm="hidePins" aria-pressed="${CM.st.hidePins}">${CM.st.hidePins ? '👁 Show pins' : '👁 Hide pins'}</button></div>
      <div class="cm-list" role="list" aria-label="Comments">
        ${note ? `<div class="cm-notebox">${CM.composerHtml()}</div>` : ''}
        ${list.length ? list.map(CM.itemHtml).join('') : k.all ? '<div class="cm-empty">Nothing matches this filter.</div>' : '<div class="cm-empty"><span class="gl" aria-hidden="true">📍</span>No comments yet. Click <b>Add comment</b>, then click anywhere on the screen.</div>'}
      </div>
      <div class="cm-foot">
        <button type="button" class="btn btn-sm" data-cm="export" aria-haspopup="menu" aria-expanded="${CM.ui.exp}"${k.all ? '' : ' disabled'}>⇩ Export ▾</button>
        ${!CM.api || CM.designer ? '<button type="button" class="btn btn-sm" data-cm="import">⇧ Import</button>' : ''}<span class="sp"></span>
        ${!CM.api || CM.designer ? `<button type="button" class="btn btn-sm btn-g" style="color:var(--color-error)" data-cm="clear"${k.all ? '' : ' disabled'}>Clear all</button>` : ''}
        ${CM.ui.exp ? `<div class="cm-menu up" role="menu"><button type="button" role="menuitem" data-cm="exportMd">Copy as Markdown<small>Numbered list with “Where” lines — paste into chat</small></button><button type="button" role="menuitem" data-cm="exportJson">Download JSON<small>Share with another reviewer, then Import</small></button></div>` : ''}
      </div>`;
    const l = $('#cm-drawer .cm-list'); if (l) l.scrollTop = listScroll;
    CM.renderComposer();
    CM.focusRestore(keep);
  },
  reposition() {
    if (CM.rafPending) return;
    CM.rafPending = true;
    requestAnimationFrame(() => { CM.rafPending = false; CM.drawPins(); });
  },
  drawPins() {
    const layer = $('#cm-pins');
    if (!layer || !CM.st) return;
    let html = '';
    if (!CM.st.hidePins) {
      CM.st.items.forEach(c => {
        if (c.kind !== 'pin') return;
        if (c.status === 'resolved' && CM.st.filter === 'open') return;
        if (c.status === 'open' && CM.st.filter === 'resolved') return;
        const p = CM.pinState(c);
        if (!['ok', 'ghost'].includes(p.st) || !CM.visible(p, c.anchor.scope)) return;
        const cls = ['cm-pin', c.status === 'resolved' ? 'res' : '', p.st === 'ghost' ? 'ghost' : '', CM.st.sel === c.n ? 'sel' : '', CM.hover === c.n ? 'hov' : ''].filter(Boolean).join(' ');
        html += `<button type="button" class="${cls}" style="left:${Math.round(p.x)}px;top:${Math.round(p.y)}px" data-cm="pin" data-n="${c.n}" data-cmh="${c.n}" title="#${c.n} · ${esc(CM.cut(c.text, 80))}" aria-label="Comment #${c.n}: ${esc(CM.cut(c.text, 60))}"><span>${c.n}</span></button>`;
      });
    }
    if (CM.ghost) {
      const a = CM.ghost.anchor;
      const el = CM.resolve(a);
      let x = a.px - window.scrollX, y = a.py - window.scrollY;
      if (el) { const r = el.getBoundingClientRect(); if (r.width || r.height) { x = r.left + r.width * a.fx; y = r.top + r.height * a.fy; } }
      html += `<span class="cm-pin ghost sel" style="left:${Math.round(x)}px;top:${Math.round(y)}px" aria-hidden="true"><span>${CM.st.seq + 1}</span></span>`;
      const box = $('#cm-composer');
      if (box && !box.hidden) {
        const w = 340, h = box.offsetHeight || 260;
        let left = x + 22, top = y - 20;
        if (left + w > window.innerWidth - 8) left = x - 22 - w;
        left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
        top = Math.max(8, Math.min(top, window.innerHeight - h - 8));
        box.style.left = left + 'px'; box.style.top = top + 'px';
      }
    }
    if (layer.dataset.html !== html) { layer.innerHTML = html; layer.dataset.html = html; }
  },
  setHover(n) {
    if (CM.hover === n) return;
    CM.hover = n;
    $$('[data-cmh]').forEach(el => el.classList.toggle('hov', n != null && el.dataset.cmh === String(n)));
    // keep pin markup cache in sync so the next redraw does not drop the class
    const layer = $('#cm-pins'); if (layer) layer.dataset.html = '';
  },
  afterAppRender() {
    if (!CM.ready) return;
    CM.syncBar();
    if (CM.st.open) CM.render();
    CM.reposition();
  },

  /* ---------- actions ---------- */
  act(k, el, e) {
    const n = el.dataset.n ? +el.dataset.n : null;
    const c = n != null ? CM.get(n) : null;
    const closeMenus = () => { CM.ui.menu = null; CM.ui.exp = false; };
    switch (k) {
      case 'toggle':
        if (CM.armed) CM.disarm();
        if (CM.st.open && CM.comp) { CM.comp = null; CM.ghost = null; }
        CM.st.open = !CM.st.open; CM.save(); closeMenus();
        CM.render(); CM.syncBar(); CM.afterLayout(); break;
      case 'close':
        if (CM.armed) CM.disarm();
        CM.comp = null; CM.ghost = null;
        CM.st.open = false; CM.save(); closeMenus(); CM.render(); CM.syncBar(); CM.afterLayout(); break;
      case 'add': closeMenus(); CM.arm(null); break;
      case 'armCancel': CM.disarm(); break;
      case 'note': closeMenus(); if (CM.comp && CM.comp.mode === 'note') { CM.comp = null; CM.render(); } else CM.openNote(); break;
      case 'who': CM.ui.who = true; CM.ui.whoText = CM.st.author; CM.render(); { const i = $('#cm-who'); if (i) { i.focus(); i.select(); } } break;
      case 'whoSave': CM.saveWho(); break;
      case 'filter': CM.st.filter = el.dataset.k; CM.save(); closeMenus(); CM.render(); CM.reposition(); break;
      case 'hidePins': CM.st.hidePins = !CM.st.hidePins; CM.save(); CM.render(); CM.reposition(); break;
      case 'select':
        if (e && e.target.closest('textarea, input, select')) return;
        if (CM.st.sel !== n || CM.ui.menu) { CM.st.sel = n; closeMenus(); CM.save(); CM.render(); CM.reposition(); CM.revealPin(n); }
        break;
      case 'pin':
        CM.st.open = true; CM.st.sel = n; closeMenus();
        if (CM.st.filter !== 'all' && !CM.filtered().some(i => i.n === n)) CM.st.filter = 'all';
        CM.save(); CM.render(); CM.syncBar(); CM.afterLayout(); CM.scrollItem(n); break;
      case 'reply': CM.st.sel = n; closeMenus(); CM.save(); CM.render(); CM.reposition(); { const r = $(`#cm-reply-${n}`); if (r) r.focus(); } break;
      case 'replySend': CM.sendReply(n); break;
      case 'resolve': case 'reopen':
        CM.update(n, { status: k === 'resolve' ? 'resolved' : 'open' }); closeMenus();
        CM.render(); CM.syncBar(); CM.reposition(); toast(`Comment #${n} ${k === 'resolve' ? 'resolved' : 'reopened'}`); break;
      case 'menu': CM.ui.exp = false; CM.ui.menu = CM.ui.menu === n ? null : n; CM.st.sel = n; CM.save(); CM.render(); { const f = $('#cm-drawer .cm-it.sel .cm-menu button'); if (f) f.focus(); } break;
      case 'edit': CM.ui.menu = null; CM.ui.edit = n; CM.ui.editText = c.text; CM.render(); { const t = $('#cm-edit'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } } break;
      case 'editCancel': CM.ui.edit = null; CM.render(); break;
      case 'editSave': CM.saveEdit(n); break;
      case 'catEdit': CM.ui.menu = null; CM.ui.catEdit = CM.ui.catEdit === n ? null : n; CM.render(); break;
      case 'setCat': CM.update(n, { cat: el.dataset.k }); CM.ui.catEdit = null; CM.render(); break;
      case 'move': CM.ui.menu = null; CM.arm(n); break;
      case 'copyLink': CM.ui.menu = null; CM.render(); CM.copyText(`#${n} — ${c.author}: ${CM.cut(c.text, 80)} · ${CM.where(c)}`, `Copied link to #${n}`); break;
      case 'delete':
        CM.ui.menu = null; CM.render();
        ask({ title: `Delete comment #${n}?`, text: 'This cannot be undone.', detail: `Number ${n} will not be reused.`, yes: 'Delete', danger: true,
          onYes: () => { CM.remove(n); CM.render(); CM.syncBar(); CM.reposition(); toast(`Comment #${n} deleted`); } });
        break;
      case 'goto': closeMenus(); CM.goTo(n); break;
      case 'reveal': CM.st.sel = n; CM.save(); CM.render(); CM.revealPin(n); CM.render(); break;
      case 'compCat': if (CM.comp) { CM.comp.cat = el.dataset.k; CM.render(); CM.renderComposer(); const t = $('#cm-text'); if (t) t.focus({ preventScroll: true }); } break;
      case 'post': CM.post(); break;
      case 'cancel': CM.closeComposer(); break;
      case 'export': if (!el.disabled) { CM.ui.menu = null; CM.ui.exp = !CM.ui.exp; CM.render(); const f = $('#cm-drawer .cm-foot .cm-menu button'); if (f) f.focus(); } break;
      case 'exportMd': CM.ui.exp = false; CM.render(); CM.copyText(CM.exportMd(), `Markdown copied (${CM.st.items.length} comment${CM.st.items.length === 1 ? '' : 's'})`); break;
      case 'exportJson': CM.ui.exp = false; CM.render(); CM.download(); break;
      case 'import': closeMenus(); CM.render(); $('#cm-import').value = ''; $('#cm-import').click(); break;
      case 'clear': closeMenus(); CM.render(); CM.clearAll(); break;
      default: break;
    }
  },
  afterLayout() { CM.reposition(); setTimeout(() => CM.reposition(), 220); },
  saveWho() {
    const v = (CM.ui.whoText || '').trim();
    if (v) CM.st.author = v;
    CM.ui.who = false; CM.save(); CM.render();
  },
  saveEdit(n) {
    const v = (CM.ui.editText || '').trim();
    if (!v) { const e = $('#cm-edit-err'); if (e) e.textContent = 'Comment text is required'; return; }
    CM.update(n, { text: v }); CM.ui.edit = null; CM.render(); toast(`Comment #${n} updated`);
  },
  sendReply(n) {
    const v = (CM.ui.reply[n] || '').trim();
    if (!v) { const r = $(`#cm-reply-${n}`); if (r) r.focus(); return; }
    if (!CM.st.author) { toast('Add your name first — click “change” at the top of the panel, or post a comment', 'warn'); CM.ui.who = true; CM.ui.whoText = ''; CM.render(); const i = $('#cm-who'); if (i) i.focus(); return; }
    const c = CM.get(n); if (!c) return;
    const reply = { author: CM.st.author, text: v, ts: new Date().toISOString() };
    c.replies = (c.replies || []).concat(reply);
    CM.ui.reply[n] = ''; CM.save(); CM.render();
    if (CM.api) CM.push('reply', { id: c.id, reply });
    const r = $(`#cm-reply-${n}`); if (r) r.focus();
  },

  /* ---------- listeners ---------- */
  isTyping(t) { return !!(t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]')); },
  onClickCapture(e) {
    const t = e.target;
    const cmEl = t.closest ? t.closest('[data-cm]') : null;
    // 1. floating composer open: outside clicks cancel it (or are blocked when text was typed)
    if (CM.comp && CM.comp.mode === 'pin' && !t.closest('#cm-composer')) {
      e.preventDefault(); e.stopImmediatePropagation();
      if (CM.comp.text.trim()) { CM.comp.err = 'Post or cancel this comment first'; CM.refreshErr(); const ta = $('#cm-text'); if (ta) ta.focus({ preventScroll: true }); return; }
      CM.closeComposer();
      if (!cmEl || cmEl.dataset.cm !== 'pin') return;
    }
    // 2. armed: the click places a pin and never reaches the app
    if (CM.armed && !cmEl && !t.closest('#cm-drawer, #cm-layer, #cm-banner')) {
      e.preventDefault(); e.stopImmediatePropagation();
      CM.place(e);
      return;
    }
    // 3. comment tooling controls
    if (cmEl) {
      if (!cmEl.matches('input, textarea, select')) e.preventDefault();
      e.stopImmediatePropagation();
      CM.act(cmEl.dataset.cm, cmEl, e);
      return;
    }
    // 4. click elsewhere closes the drawer menus (the click itself proceeds)
    if ((CM.ui.menu || CM.ui.exp) && !t.closest('.cm-menu')) { CM.ui.menu = null; CM.ui.exp = false; CM.render(); }
  },
  onKeyCapture(e) {
    const t = e.target;
    if (e.key === 'Escape') {
      if (CM.comp) { e.preventDefault(); e.stopImmediatePropagation(); CM.closeComposer(); return; }
      if (CM.armed) { e.preventDefault(); e.stopImmediatePropagation(); CM.disarm(); return; }
      if (CM.ui.menu || CM.ui.exp) { e.preventDefault(); e.stopImmediatePropagation(); const n = CM.ui.menu; CM.ui.menu = null; CM.ui.exp = false; CM.render(); const b = n ? $(`#cm-drawer .cm-it[data-n="${n}"] .cm-more`) : $('#cm-drawer [data-cm="export"]'); if (b) b.focus(); return; }
      if (CM.ui.edit != null || CM.ui.catEdit != null || CM.ui.who) { e.preventDefault(); e.stopImmediatePropagation(); CM.ui.edit = null; CM.ui.catEdit = null; CM.ui.who = false; CM.render(); return; }
      return;
    }
    if (t && t.id) {
      if ((t.id === 'cm-text') && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.stopImmediatePropagation(); CM.post(); return; }
      if (t.id === 'cm-name' && e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); const ta = $('#cm-text'); if (ta) ta.focus(); return; }
      if (t.id === 'cm-edit' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.stopImmediatePropagation(); CM.saveEdit(CM.ui.edit); return; }
      if (t.id === 'cm-who' && e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); CM.saveWho(); return; }
      if (t.id.startsWith('cm-reply-') && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.stopImmediatePropagation(); CM.sendReply(+t.id.slice(9)); return; }
    }
    if (t && t.classList && t.classList.contains('cm-it')) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopImmediatePropagation(); CM.act('select', t, e); const again = $(`#cm-drawer .cm-it[data-n="${t.dataset.n}"]`); if (again) again.focus(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const all = $$('#cm-drawer .cm-it'), i = all.indexOf ? all.indexOf(t) : [...all].indexOf(t);
        const nx = [...all][i + (e.key === 'ArrowDown' ? 1 : -1)];
        if (nx) nx.focus();
        return;
      }
    }
    if (e.ctrlKey || e.metaKey || e.altKey || CM.isTyping(t) || CM.comp) return;
    if (e.key === 'c' || e.key === 'C') { e.preventDefault(); CM.act('toggle', { dataset: {} }); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); if (CM.armed) CM.disarm(); else CM.arm(null); }
  },
  onInput(e) {
    const t = e.target; if (!t.id || !t.id.startsWith('cm-')) return;
    e.stopImmediatePropagation();
    if (t.id === 'cm-text' && CM.comp) { CM.comp.text = t.value; if (CM.comp.err) { CM.comp.err = ''; CM.refreshErr(); } }
    else if (t.id === 'cm-name' && CM.comp) { CM.comp.name = t.value; if (CM.comp.err) { CM.comp.err = ''; CM.refreshErr(); } }
    else if (t.id === 'cm-edit') { CM.ui.editText = t.value; const x = $('#cm-edit-err'); if (x) x.textContent = ''; }
    else if (t.id === 'cm-who') CM.ui.whoText = t.value;
    else if (t.id.startsWith('cm-reply-')) CM.ui.reply[+t.id.slice(9)] = t.value;
  },
  boot() {
    CM.load();
    document.body.insertAdjacentHTML('beforeend', `<aside id="cm-drawer" role="complementary" aria-label="Review comments"></aside>
      <div id="cm-layer"><div id="cm-pins"></div><div id="cm-composer" role="dialog" aria-label="New comment" hidden></div></div>
      <div id="cm-hover" hidden></div><div id="cm-hover-lbl" hidden></div><div id="cm-banner" role="status" hidden></div>
      <input type="file" id="cm-import" accept=".json,application/json" hidden>`);
    document.addEventListener('click', CM.onClickCapture, true);
    document.addEventListener("mousedown", e => { if (CM.armed && e.target.closest && !e.target.closest('[data-cm], #cm-drawer, #cm-layer, #cm-banner')) e.preventDefault(); }, true);
    document.addEventListener("mousemove", e => { if (CM.armed && e.target.closest) { if (e.target.closest('#cm-drawer, #cm-layer, #cm-banner')) { $('#cm-hover').hidden = true; $('#cm-hover-lbl').hidden = true; } else CM.hoverAt(e.target); } }, true);
    document.addEventListener('keydown', CM.onKeyCapture, true);
    document.addEventListener('input', CM.onInput, true);
    document.addEventListener('change', e => { if (e.target.id && e.target.id.startsWith('cm-')) e.stopImmediatePropagation(); }, true);
    document.addEventListener('focusout', e => { if (e.target.id === 'cm-who' && CM.ui.who && !(e.relatedTarget && e.relatedTarget.dataset && e.relatedTarget.dataset.cm === 'whoSave')) CM.saveWho(); }, true);
    document.addEventListener('mouseover', e => { const h = e.target.closest && e.target.closest('[data-cmh]'); CM.setHover(h ? +h.dataset.cmh : null); });
    window.addEventListener('scroll', () => CM.reposition(), { capture: true, passive: true });
    window.addEventListener('resize', () => { CM.reposition(); if (CM.st.open) CM.render(); });
    document.body.addEventListener('transitionend', e => { if (e.target === document.body) CM.reposition(); });
    $('#cm-import').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => CM.importText(String(r.result || ''));
      r.onerror = () => toast('Could not read that file', 'err');
      r.readAsText(f);
    });
    CM.ready = true;
    render();
    window.__cm = CM;
    CM.startPoll();
  }
};
CM.boot();
</script>
</body>
</html>
