<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>E-Tendering prototype — review</title>
<style>
:root{--teal:#13585A;--teal-soft:#E3F0F0;--proto:#460479;--proto-bg:#F5EFF9;--proto-line:#D9C6E6;--text:#222;--muted:#666;--border:#DDD;--err:#C13515;--pin:#B45309}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 14px/1.45 'Open Sans','Segoe UI',Roboto,system-ui,sans-serif;color:var(--text);background:#F4F6F6;display:flex;flex-direction:column}
.top{height:56px;background:var(--teal);color:#fff;display:flex;align-items:center;padding:0 24px;gap:16px}
.top .wm{font-weight:800;font-size:20px;letter-spacing:.5px}
.top span{opacity:.9}
main{flex:1;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:420px;background:#fff;border-radius:14px;box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.05) 0 2px 6px,rgba(0,0,0,.1) 0 6px 16px;padding:28px}
.tag{display:inline-block;font-size:10px;letter-spacing:.32px;text-transform:uppercase;background:var(--proto);color:#fff;padding:2px 8px;border-radius:999px;font-weight:700;margin-bottom:12px}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input{width:100%;height:42px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font:inherit;font-size:16px;letter-spacing:2px}
input:focus{outline:2px solid var(--teal);border-color:transparent}
button{margin-top:12px;width:100%;height:42px;border:0;border-radius:8px;background:var(--teal);color:#fff;font:600 14px inherit;cursor:pointer}
button:hover{background:#0E4446}
button[disabled]{opacity:.6;cursor:default}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:8px}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
.loading{text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><span class="wm">wrench</span><span>E-Tendering · Procurement Control prototype</span></header>
<main>
  <form class="card" id="f" autocomplete="off">
    <span class="tag">Review access</span>
    <h1>Enter the review passcode</h1>
    <p>You received it with this link. It is remembered on this browser.</p>
    <label for="code">Passcode</label>
    <input id="code" type="password" inputmode="text" autocapitalize="off" spellcheck="false" autofocus>
    <button id="go" type="submit">Open prototype</button>
    <div class="err" id="err" role="alert"></div>
    <div class="hint">Once inside, use <b>💬 Comments</b> in the purple bar to leave feedback anywhere on the screen.</div>
  </form>
</main>
<script>
(function () {
  const KEY = 'wrench-etender-review-code';
  const f = document.getElementById('f'), inp = document.getElementById('code'), err = document.getElementById('err'), go = document.getElementById('go');
  const get = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  const set = v => { try { localStorage.setItem(KEY, v); } catch (e) { /* storage blocked */ } };
  async function open(code, silent) {
    go.disabled = true; err.textContent = silent ? '' : 'Checking…';
    try {
      const r = await fetch('/api/app', { headers: { 'x-review-code': code }, cache: 'no-store' });
      if (r.status === 401) { if (!silent) err.textContent = 'That passcode was not accepted.'; go.disabled = false; inp.focus(); inp.select(); return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const html = await r.text();
      set(code);
      document.open(); document.write(html); document.close();
    } catch (e) {
      err.textContent = 'Could not reach the server. Check your connection and try again.';
      go.disabled = false;
    }
  }
  f.addEventListener('submit', e => { e.preventDefault(); const v = inp.value.trim(); if (!v) { err.textContent = 'Please enter the passcode.'; inp.focus(); return; } open(v, false); });
  const saved = get();
  if (saved) { inp.value = saved; open(saved, true); }
})();
</script>
</body>
</html>
